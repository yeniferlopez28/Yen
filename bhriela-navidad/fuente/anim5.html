<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Paris;src:url(fonts/Parisienne.ttf)}
@font-face{font-family:Cav;src:url(fonts/Caveat.ttf)}
@font-face{font-family:Corm;src:url(fonts/Cormorant+Garamond.ttf)}
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

// ---------- utils ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutCubic=t=>1-Math.pow(1-t,3);
const eInQuad=t=>t*t;
const eInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eOutElastic=t=>t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1;

const C={cream:'#f5ecdb',sage:'#dfe3d0',pine:'#2e4a3a',pineD:'#20352a',vino:'#7c1f2e',vinoD:'#5a1420',gold:'#d6a84a',goldL:'#f3d68a',ink:'#2a1914',
 negro:'#242122',choc:'#4e2c23',cafe:'#62402a',slouch:'#57322a'};

// ---------- textures ----------
function makeGrain(){const g=document.createElement('canvas');g.width=W;g.height=H;const x=g.getContext('2d');const id=x.createImageData(W,H);const r=rng(7);
 for(let i=0;i<id.data.length;i+=4){const v=r();const d=v<.5?0:255;id.data[i]=id.data[i+1]=id.data[i+2]=d;id.data[i+3]=Math.floor(r()*14)}x.putImageData(id,0,0);return g}
const grain=makeGrain();
function makeSuede(){const g=document.createElement('canvas');g.width=260;g.height=460;const x=g.getContext('2d');const r=rng(3);
 for(let i=0;i<9000;i++){x.fillStyle=r()<.5?'rgba(0,0,0,.10)':'rgba(255,230,200,.07)';x.fillRect(r()*260,r()*460,1.6,1.6)}return g}
const suede=makeSuede();

// wallpaper with stripes
function makeWall(dark){const g=document.createElement('canvas');g.width=W;g.height=H;const x=g.getContext('2d');
 x.fillStyle=dark?'#e9dcc3':C.cream;x.fillRect(0,0,W,H);
 const r=rng(11);const sw=54;
 for(let i=0;i*sw*2<W+sw;i++){const x0=i*sw*2;x.fillStyle=dark?'#cfd3bd':C.sage;
   x.beginPath();x.moveTo(x0,0);for(let y=0;y<=H;y+=40)x.lineTo(x0+Math.sin(y*.01+i)*1.5,y);for(let y=H;y>=0;y-=40)x.lineTo(x0+sw+Math.sin(y*.012+i*2)*1.5,y);x.fill();
   x.strokeStyle='rgba(124,31,46,.35)';x.lineWidth=3;x.beginPath();x.moveTo(x0+sw/2,0);x.lineTo(x0+sw/2,H);x.stroke();}
 x.drawImage(grain,0,0);
 // soft vignette
 const vg=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,30,10,.18)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 return g}
const wall=makeWall(false), wall2=makeWall(true);

// ---------- sketchy stroke ----------
function sketch(p,lw=5,col=C.ink){ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke(p);
 ctx.globalAlpha*=.35;ctx.lineWidth=lw*.45;ctx.translate(1.8,1.2);ctx.stroke(p);ctx.restore()}

// ---------- boots (local box 240x440, sole at y=440) ----------
const FOOT=" Q172,298 206,328 Q254,364 270,410 Q276,436 260,440 L160,440 Q120,436 104,400 L98,440 L56,440 L52,392";
const P={
 knee:new Path2D("M48,6 Q100,-8 156,4 L162,238"+FOOT+" Q30,330 40,230 Z"),
 kneeTop:new Path2D("M48,6 Q100,-8 156,4 Q100,22 48,6 Z"),
 slouch:new Path2D("M50,10 Q102,-4 158,8 Q170,40 160,72 Q172,104 162,134 Q174,168 163,200 Q170,230 164,248"+FOOT+" Q34,330 42,282 Q30,246 41,210 Q28,172 39,138 Q28,104 41,72 Q30,40 50,10 Z"),
 slouchTop:new Path2D("M50,10 Q102,-4 158,8 Q102,24 50,10 Z"),
 mid:new Path2D("M44,150 Q100,138 160,148 L164,250"+FOOT+" Q34,330 40,250 Z"),
 flap:new Path2D("M34,158 Q100,144 168,156 Q182,250 204,330 Q226,380 226,432 L60,440 Q40,330 34,158 Z"),
 flapTop:new Path2D("M34,158 Q100,144 168,156 Q100,170 34,158 Z"),
 band:new Path2D("M36,184 Q100,170 172,182 L174,204 Q100,192 38,206 Z"),
 strap:new Path2D("M44,300 Q110,312 180,318 L178,342 Q110,336 46,324 Z"),
 sole:new Path2D("M260,440 L160,440"),
};
function shine(){ctx.save();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(138,34);ctx.quadraticCurveTo(146,140,148,232);ctx.stroke();
 ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(214,348);ctx.quadraticCurveTo(248,370,258,402);ctx.stroke();ctx.restore()}
function padlock(x,y,glint){ctx.save();ctx.translate(x,y);
 ctx.strokeStyle=C.gold;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-7,-12);ctx.quadraticCurveTo(0,-20,7,-12);ctx.lineTo(7,0);ctx.stroke();
 const b=new Path2D("M-13,0 L13,0 L13,26 L-13,26 Z");ctx.fillStyle=C.gold;ctx.fill(b);sketch(b,2.5,'#7a5418');
 ctx.fillStyle=C.goldL;ctx.fillRect(-9,3,6,18);ctx.fillStyle='#a77a26';ctx.fillRect(-2,26,4,12);
 ctx.restore();}
function buckle(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(.09);const o=new Path2D("M-18,-17 L18,-17 L18,17 L-18,17 Z");ctx.fillStyle=C.gold;ctx.fill(o);
 ctx.fillStyle=C.choc;ctx.fillRect(-10,-9,20,18);sketch(o,2.5,'#7a5418');ctx.fillStyle=C.goldL;ctx.fillRect(-15,-14,4,28);ctx.restore()}
function hwPos(type){return type==='candado'?[66,214]:type==='hebilla'?[118,326]:null}
function drawBoot(type){
 if(type==='candado'){
   ctx.fillStyle=C.negro;ctx.fill(P.mid);sketch(P.mid);
   ctx.fillStyle='#2b2728';ctx.fill(P.flap);sketch(P.flap);ctx.fillStyle='#0e0c0c';ctx.fill(P.flapTop);
   ctx.fillStyle='#161415';ctx.fill(P.band);sketch(P.band,3);
   ctx.save();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(150,214);ctx.quadraticCurveTo(172,300,200,380);ctx.stroke();ctx.restore();
   ctx.lineWidth=7;ctx.strokeStyle='#0b0b0b';ctx.stroke(P.sole);
   padlock(66,204);
 } else if(type==='hebilla'){
   ctx.fillStyle=C.choc;ctx.fill(P.knee);shine();sketch(P.knee);ctx.fillStyle='#221210';ctx.fill(P.kneeTop);
   ctx.fillStyle='#3e211b';ctx.fill(P.strap);sketch(P.strap,3);buckle(118,326);
   ctx.lineWidth=7;ctx.strokeStyle='#120808';ctx.stroke(P.sole);
 } else if(type==='gamuza'){
   ctx.fillStyle=C.cafe;ctx.fill(P.knee);ctx.save();ctx.clip(P.knee);ctx.drawImage(suede,0,0);ctx.restore();
   ctx.save();ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(30,15,8,.55)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(100,14);ctx.quadraticCurveTo(104,200,108,330);ctx.stroke();ctx.restore();
   sketch(P.knee);ctx.fillStyle='#2a170d';ctx.fill(P.kneeTop);
   ctx.lineWidth=7;ctx.strokeStyle='#120808';ctx.stroke(P.sole);
 } else if(type==='slouch'){
   ctx.fillStyle=C.slouch;ctx.fill(P.slouch);shine();
   ctx.save();ctx.strokeStyle='rgba(20,8,5,.6)';ctx.lineWidth=3.5;ctx.lineCap='round';
   for(const y of [62,118,172,222]){ctx.beginPath();ctx.moveTo(56,y);ctx.quadraticCurveTo(100,y+16,152,y-2);ctx.stroke()}
   ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=5;for(const y of [80,138,192]){ctx.beginPath();ctx.moveTo(70,y);ctx.quadraticCurveTo(105,y+12,140,y);ctx.stroke()}
   ctx.restore();sketch(P.slouch);ctx.fillStyle='#221210';ctx.fill(P.slouchTop);
   ctx.lineWidth=7;ctx.strokeStyle='#120808';ctx.stroke(P.sole);
 }
}

// ---------- decorative ----------
function star(x,y,r,a,col=C.goldL){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
 for(let i=0;i<8;i++){const rr=i%2?r*.28:r;const an=i*Math.PI/4-Math.PI/2;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function sparkleBurst(x,y,t0,t,n=7,seed=1,rad=110){const p=prog(t,t0,t0+.7);if(p<=0||p>=1)return;const r=rng(seed);
 for(let i=0;i<n;i++){const an=r()*Math.PI*2,d=rad*(.5+r()*.6)*eOutCubic(p);star(x+Math.cos(an)*d,y+Math.sin(an)*d,(10+r()*14)*(1-p*.6),1-p,r()<.3?'#fff':C.goldL)}}
function glint(x,y,t0,t,s=1){const p=prog(t,t0,t0+.55);if(p<=0||p>=1)return;const k=Math.sin(p*Math.PI);star(x,y,34*k*s,k,'#fff');star(x,y,16*k*s,k,C.goldL)}
const ambient=(()=>{const r=rng(99);return Array.from({length:26},()=>({x:r()*W,y:r()*H,ph:r()*6.28,s:6+r()*10}))})();
function ambientStars(t,a=1){for(const s of ambient){const k=.5+.5*Math.sin(t*3+s.ph);star(s.x,s.y,s.s*k,.75*k*a,C.gold)}}

function confetti(t0,t,x,y,seed){const p=prog(t,t0,t0+1.6);if(p<=0||p>=1)return;const r=rng(seed);
 for(let i=0;i<40;i++){const vx=(r()-.5)*1300,vy=-600-r()*900;const tt=p*1.6;const px=x+vx*tt*.6,py=y+vy*tt+900*tt*tt;
  ctx.save();ctx.globalAlpha=1-p;ctx.translate(px,py);ctx.rotate(tt*8*(r()-.5)*2);const c=[C.gold,C.vino,C.pine,'#fff'][i%4];ctx.fillStyle=c;
  if(i%3===0){ctx.restore();star(px,py,12,1-p,c);continue}ctx.fillRect(-8,-4,16,8);ctx.restore()}}

// gift box (shoe box) centered at bottom (cx, by)
function drawBox(cx,by,sx,sy,lidY,lidRot,lidA){
 ctx.save();ctx.translate(cx,by);ctx.scale(sx,sy);
 const w=520,h=290;const body=new Path2D(`M${-w/2},${-h} L${w/2},${-h} L${w/2-6},0 L${-w/2+6},0 Z`);
 // shadow
 ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,8,w*.55,22,0,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.fillStyle=C.vino;ctx.fill(body);
 ctx.save();ctx.clip(body);const r=rng(5);ctx.fillStyle='rgba(255,236,200,.5)';for(let i=0;i<40;i++){const x=-w/2+r()*w,y=-h+r()*h;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()}
 ctx.fillStyle=C.gold;ctx.fillRect(-26,-h,52,h);ctx.fillStyle=C.goldL;ctx.fillRect(-18,-h,8,h);ctx.restore();
 sketch(body);
 ctx.restore();
 // lid
 ctx.save();ctx.translate(cx,by-290*sy+lidY);ctx.rotate(lidRot);ctx.globalAlpha=lidA;ctx.scale(sx,sy);
 const lw=560,lh=86;const lid=new Path2D(`M${-lw/2},${-lh} L${lw/2},${-lh} L${lw/2},0 L${-lw/2},0 Z`);
 ctx.fillStyle=C.vinoD;ctx.fill(lid);ctx.save();ctx.clip(lid);ctx.fillStyle=C.gold;ctx.fillRect(-26,-lh,52,lh);ctx.restore();sketch(lid);
 // bow
 ctx.fillStyle=C.gold;const bl=new Path2D("M0,-86 C-40,-170 -150,-150 -110,-100 C-90,-78 -40,-84 0,-86 Z"),br=new Path2D("M0,-86 C40,-170 150,-150 110,-100 C90,-78 40,-84 0,-86 Z");
 ctx.fill(bl);ctx.fill(br);sketch(bl,4);sketch(br,4);ctx.beginPath();ctx.ellipse(0,-88,20,16,0,0,7);ctx.fillStyle=C.goldL;ctx.fill();sketch(new Path2D("M-20,-88 a20,16 0 1,0 40,0 a20,16 0 1,0 -40,0"),3);
 ctx.restore();
}

function writeText(txt,x,y,font,col,p,align='center'){if(p<=0)return;ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline='alphabetic';
 const m=ctx.measureText(txt);const w=m.width;let x0=align==='center'?x-w/2:x;ctx.beginPath();ctx.rect(x0-40,y-260,(w+80)*eOutCubic(p),400);ctx.clip();
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillText(txt,x+3,y+4);ctx.fillStyle=col;ctx.fillText(txt,x,y);ctx.restore()}

// ---------- scene A/B: box & boots ----------
const BOOTS=[{t:'candado',label:'Candado'},{t:'hebilla',label:'Hebilla'},{t:'gamuza',label:'Gamuza'},{t:'slouch',label:'Slouch'}];
const POP=[2.95,3.6,4.25,4.9];
function sceneBox(t){
 ctx.drawImage(wall,0,0);ambientStars(t,prog(t,0,.6));
 const cx=540,ground=1640;
 // drop
 let by,sx=1,sy=1;const pd=prog(t,.15,1.0);by=lerp(-200,ground,eInQuad(pd));
 if(t>1.0){const q=prog(t,1.0,1.55);const sq=Math.sin(q*Math.PI*2.2)*Math.exp(-q*3.5);sx=1+sq*.16;sy=1-sq*.16}
 let rot=0;if(t>1.6&&t<2.35){const q=prog(t,1.6,2.35);rot=Math.sin(q*Math.PI*7)*.05*(1-q)}
 // lid
 let lidY=0,lidRot=0,lidA=1;if(t>2.35){const q=prog(t,2.35,3.2);lidY=-q*1100+q*q*700;lidRot=-q*1.3;lidA=1-prog(t,2.9,3.2)}
 ctx.save();ctx.translate(cx,by);ctx.rotate(rot);ctx.translate(-cx,-by);
 // boots inside poking? draw after
 drawBox(cx,by,sx,sy,lidY,lidRot,lidA);ctx.restore();
 confetti(2.35,t,cx,ground-320,21);sparkleBurst(cx,ground-330,2.4,t,10,4,220);
 // boots (watercolor stickers): pop big from the box, then settle in a row
 const NAMES=['Alta tejida','Plisada','Gamuza','Candado'];const slots=[140,400,660,920],rowB=1200;const T0=[2.9,3.6,4.3,5.0];
 const drawn=[];
 for(let i=0;i<4;i++){const img=STK[i];if(!img)continue;const a=T0[i];if(t<a)continue;
  const sSlot=Math.min(252/img.width,470/img.height),sBig=Math.min(820/img.width,880/img.height);
  const p1=prog(t,a,a+.32),p2=prog(t,a+.62,a+.95);
  let x,y,s,rot;
  if(p2<=0){x=lerp(cx,540,eOutCubic(p1));y=lerp(ground-300,1260,eOutCubic(p1));s=lerp(sBig*.15,sBig,eOutBack(p1));rot=(1-eOutCubic(p1))*(i%2?.5:-.5)+Math.sin((t-a)*6)*.02}
  else{x=lerp(540,slots[i],eInOutCubic(p2));y=lerp(1260,rowB,eInOutCubic(p2))-Math.sin(p2*Math.PI)*120;s=lerp(sBig,sSlot,eInOutCubic(p2));rot=Math.sin(p2*Math.PI)*(i%2?-.15:.15)}
  const bob=p2>=1?Math.sin((t-a)*3+i)*5:0;
  drawn.push({i,x,y:y+bob,s,rot,img,big:p2<1});
  if(p2>=1){ctx.save();ctx.globalAlpha=.15;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(slots[i],rowB+10,100,13,0,0,7);ctx.fill();ctx.restore();
    writeText(NAMES[i],slots[i],rowB+82,'600 56px Cav',C.pine,prog(t,a+.95,a+1.35));}
  // big name while showcased
  const bl=prog(t,a+.15,a+.4)*(1-prog(t,a+.6,a+.75));if(bl>0){ctx.save();ctx.globalAlpha=bl;writeText(NAMES[i],540,300,'150px Paris',C.vino,1);ctx.restore()}
  sparkleBurst(540,900,a+.3,t,12,30+i,380,.7);
 }
 drawn.sort((p,q)=>(p.big?1:0)-(q.big?1:0)).forEach(d=>{ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.drawImage(d.img,-d.img.width*d.s/2,-d.img.height*d.s,d.img.width*d.s,d.img.height*d.s);ctx.restore()});
 // title
 writeText('Navidad',540,420,'200px Paris',C.vino,prog(t,5.45,6.25));
 const tp=prog(t,5.95,6.4);if(tp>0){ctx.save();ctx.globalAlpha=tp;ctx.font='600 46px Corm';ctx.textAlign='center';ctx.fillStyle=C.pine;
   ctx.letterSpacing='14px';ctx.fillText('COLECCIÓN DE BOTAS',547,520);ctx.restore()}
 star(830,270,30*Math.max(0,Math.sin(t*4)),prog(t,6,6.3));
}

// ---------- scene C: fireplace ----------
function bricks(x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='#8a3a3a';ctx.fillRect(x,y,w,h);
 const bh=46,bw=110;const r=rng(17);for(let j=0;j*bh<h;j++){for(let i=-1;i*bw<w+bw;i++){const bx=x+i*bw+(j%2?bw/2:0),byy=y+j*bh;ctx.fillStyle=`hsl(${355+r()*10},${38+r()*12}%,${30+r()*9}%)`;ctx.fillRect(bx+4,byy+4,bw-8,bh-8)}}
 ctx.drawImage(grain,0,0);ctx.restore()}
function flame(cx,by,t){const layers=[['#e8572a',1],['#f39a2b',.72],['#fbd35a',.45]];
 layers.forEach(([c,s],k)=>{ctx.save();ctx.translate(cx,by);ctx.scale(s,s);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-150,0);
  for(let i=0;i<=6;i++){const x=-150+i*50;const hgt=150+60*Math.sin(t*9+i*1.7+k)+(i%2?60:0);ctx.quadraticCurveTo(x-25,-hgt*.6,x,-hgt);ctx.quadraticCurveTo(x+25,-hgt*.5,x+25,-20)}
  ctx.lineTo(150,0);ctx.closePath();ctx.fill();ctx.restore()})}
const HOOKS=[255,445,635,825],MANTEL=900;
function sceneFire(t){
 ctx.drawImage(wall2,0,0);
 // floor
 ctx.fillStyle='#a9774f';ctx.fillRect(0,1700,W,220);ctx.strokeStyle='rgba(60,30,15,.35)';ctx.lineWidth=3;for(let y=1730;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // fireplace
 bricks(150,MANTEL,780,800);sketch(new Path2D("M150,900 L930,900 L930,1700 L150,1700 Z"));
 const op=new Path2D("M330,1700 L330,1420 Q540,1260 750,1420 L750,1700 Z");ctx.fillStyle='#1d0f0b';ctx.fill(op);
 ctx.save();ctx.clip(op);const gl=ctx.createRadialGradient(540,1690,20,540,1650,330);gl.addColorStop(0,'rgba(255,170,60,.8)');gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(300,1250,500,460);
 flame(540,1690,t);ctx.fillStyle='#4a2a18';ctx.fillRect(420,1660,240,30);ctx.restore();sketch(op);
 // mantel
 const m=new Path2D("M110,850 L970,850 L970,915 L110,915 Z");ctx.fillStyle='#7a4a2c';ctx.fill(m);ctx.fillStyle='rgba(255,220,180,.18)';ctx.fillRect(110,852,860,12);sketch(m);
 // garland
 ctx.save();ctx.fillStyle=C.pine;for(let x=110;x<=970;x+=34){ctx.beginPath();ctx.ellipse(x,850+Math.sin(x*.05)*6,30,20,x*.1,0,7);ctx.fill()}
 ctx.fillStyle=C.pineD;for(let x=127;x<=970;x+=34){ctx.beginPath();ctx.ellipse(x,858,20,12,-x*.1,0,7);ctx.fill()}ctx.restore();
 for(let i=0;i<26;i++){const x=125+i*33,y=850+Math.sin(i*1.3)*14;const on=.5+.5*Math.sin(t*5+i*1.9);ctx.save();ctx.globalAlpha=.4+.6*on;ctx.fillStyle=i%3===0?'#ff6b5a':i%3===1?C.goldL:'#fff3c4';
   ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18*on;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();ctx.restore()}
 // gifts on floor
 [[60,1700,150,120,C.pine],[870,1700,170,140,C.vino],[985,1700,90,80,C.gold]].forEach(([x,y,w,h,c])=>{const g=new Path2D(`M${x},${y} L${x+w},${y} L${x+w},${y-h} L${x},${y-h} Z`);ctx.fillStyle=c;ctx.fill(g);ctx.fillStyle=c===C.gold?C.vino:C.goldL;ctx.fillRect(x+w/2-9,y-h,18,h);sketch(g,4)});
 // boots hanging
 BOOTS.forEach((b,i)=>{const td=.2+i*.17;const q=prog(t,td,td+.5);if(q<=0)return;const img=STK[i];
   const hx=HOOKS[i],hy=MANTEL+10;
   ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,915);ctx.lineTo(hx,hy+18);ctx.arc(hx+10,hy+18,10,Math.PI,0,true);ctx.stroke();ctx.restore();
   const drop=(1-eOutBack(q))*-700;const sw=Math.sin(t*2.2+i*1.3)*.045+(t-td<1.2?Math.sin((t-td)*12)*.12*Math.exp(-(t-td)*3):0);
   ctx.save();ctx.translate(hx+10,hy+30+drop);ctx.rotate(sw);
   ctx.strokeStyle=C.vino;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-30,24);ctx.moveTo(0,-14);ctx.lineTo(30,24);ctx.stroke();
   const sc=Math.min(185/img.width,330/img.height);ctx.drawImage(img,-img.width*sc/2,18,img.width*sc,img.height*sc);ctx.restore();
 });
 // text
 writeText('Este año,',540,420,'150px Paris',C.vino,prog(t,1.0,1.6));
 writeText('regala estilo',540,640,'180px Paris',C.pine,prog(t,1.5,2.3));
 sparkleBurst(880,560,2.25,t,9,77,160);
 ambientStars(t,.8);
}

// ---------- master ----------
function render(t){ctx.clearRect(0,0,W,H);
 if(t<7.05) sceneBox(t); else sceneFire(t-7.05);
 // stripe wipe transition 6.75-7.35
 const a=prog(t,6.75,7.05),b=prog(t,7.05,7.4);if(a>0&&b<1){const n=12,cw=W/n;for(let i=0;i<n;i++){const d=i*.04;
   const ca=eInOutCubic(clamp((a-d)/(1-.44))),cb=eInOutCubic(clamp((b-d)/(1-.44)));const top=cb*H,bot=ca*H;ctx.fillStyle=i%2?C.pine:C.vino;ctx.fillRect(i*cw,top,cw+1,bot-top)}}
 // flash to real footage
 const f=prog(t,9.8,10);if(f>0){ctx.fillStyle=`rgba(255,250,240,${f})`;ctx.fillRect(0,0,W,H)}
}

// snow overlay (seamless 8s loop)
const flakes=(()=>{const r=rng(55);return Array.from({length:110},()=>({x:r()*W,y0:r()*H,s:3+r()*7,a:.55+r()*.45,k:1+Math.floor(r()*2),ph:r()*6.28,sw:15+r()*35}))})();
function renderSnow(t){ctx.clearRect(0,0,W,H);const L=8;for(const f of flakes){const y=((f.y0+(t/L)*H*f.k)%(H+40))-20;const x=f.x+Math.sin(t*2*Math.PI/L*2+f.ph)*f.sw;
 ctx.save();ctx.globalAlpha=f.a;ctx.fillStyle='#fff';ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=f.s*1.5;ctx.beginPath();ctx.arc(x,y,f.s*.5+1,0,7);ctx.fill();ctx.restore()}
 // a few twinkles
 for(let i=0;i<8;i++){const r=rng(200+i);const x=r()*W,y=r()*H;const k=Math.max(0,Math.sin(t*2*Math.PI/L*(1+i%3)+i));star(x,y,22*k,k*.9,'#fff6d8')}}
window.render=render;window.renderSnow=renderSnow;
const STK=[];window.ready=Promise.all([1,2,3,4].map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{STK[k-1]=i;r()};i.src='img/b'+k+'.png'})));
</script></body></html>
