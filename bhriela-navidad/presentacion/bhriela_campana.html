<title>Bhriela Campaña Meta Ads</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@400;500&family=Josefin+Sans:wght@600;700&display=swap"><style id="st">
/* Layout: one long scrolling story, each campaign topic a full-width band; boots float in the margins of every band. Brand look: wine, cream, sand and gold, single light world. */
:root{
  --wine:#7A1F2D; --wine-d:#561520; --cream:#FAFCFD; --sand:#E2ECF1; --paper:#FFFFFF; --blue:#BCD0D8; --blue-d:#557A8C; --ring:#D5DBE0;
  --gold:#C79A3E; --gold-l:#EBCB85; --ink:#2B1D19; --muted:#56606A; --night:#1D2C36; --on-wine:#F4E4DA;
  --display:'Josefin Sans',Futura,'Trebuchet MS',sans-serif; --body:'Nunito Sans',system-ui,Arial,sans-serif; --script:'Cormorant Garamond',Georgia,serif;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;overflow-x:hidden}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
.band{position:relative;overflow:hidden;padding-block:clamp(72px,10vw,130px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto}
.b-cream{background:var(--cream)} .b-sand{background:var(--sand)} .b-wine{background:var(--wine);color:var(--paper)} .b-night{background:var(--night);color:var(--paper)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--blue-d)}
.b-wine .eyebrow,.b-night .eyebrow{color:var(--blue)}
.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:.04em;text-transform:uppercase;color:var(--wine);text-wrap:balance}
.b-wine .title,.b-night .title{color:var(--paper)}
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:clamp(32px,5vw,56px)}
.script{font-family:var(--script);font-style:italic;font-weight:600;color:var(--wine)}
.muted{color:var(--muted)}
/* cards */
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;background:var(--paper);border:1px solid #DCE7EC;border-radius:24px;padding:30px;box-shadow:0 12px 36px rgba(85,122,140,.14);display:flex;flex-direction:column;gap:14px;min-width:0}
.card .lbl{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);line-height:1.25}
.card .txt{font-size:17px;color:var(--muted);line-height:1.5}
.chip{width:54px;height:54px;border-radius:50%;background:var(--wine);display:grid;place-items:center;flex:none}
.chip svg{width:26px;height:26px;stroke:var(--gold-l);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.inv{background:var(--wine);color:var(--paper)} .card.inv .lbl{color:var(--gold-l)} .card.inv .txt{color:var(--on-wine)} .card.inv .chip{background:var(--paper)} .card.inv .chip svg{stroke:var(--wine)}
.card.dark{background:var(--ink)} .card.dark .lbl{color:var(--gold-l)} .card.dark .num{color:var(--paper)} .card.dark .txt{color:#E5D4C8}
/* floating boots + sparkles */
.deco{position:absolute;z-index:1;pointer-events:none;user-select:none}
.boot{object-fit:contain}
.fa,.fb,.fc,.spark,.flake,.lucy,.gifts .pol,.snow span{will-change:transform}
.band:not(.hero){content-visibility:auto;contain-intrinsic-size:auto 1000px}
.fa{animation:bobA 3.6s ease-in-out infinite alternate}
.fb{animation:bobB 4.2s ease-in-out infinite alternate}
.fc{animation:sway 4.8s ease-in-out infinite alternate}
@keyframes bobA{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(3deg)}}
@keyframes bobB{from{transform:translateY(-20px) rotate(7deg)}to{transform:translateY(8px) rotate(-3deg)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.spark{width:34px;height:34px;animation:tw 1.9s ease-in-out infinite alternate}
.spark path{fill:var(--gold)} .spark:nth-of-type(even) path{fill:var(--blue-d)} .b-wine .spark path,.b-night .spark path{fill:var(--gold-l)} .b-wine .spark:nth-of-type(even) path,.b-night .spark:nth-of-type(even) path{fill:var(--blue)}
@keyframes tw{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
/* scroll-driven reveals: the page is complete at rest; supporting browsers ease things in as you scroll */
@supports (animation-timeline: view()){
  .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
  .rv-pop{animation:pop linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  .line-draw{animation:drawx linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
}
@keyframes rise{from{opacity:0;transform:translateY(60px)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes drawx{from{transform:scaleX(0)}}
/* hero */
.hero{min-height:min(820px,92svh);display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#8E2838 0%,var(--wine) 45%,var(--wine-d) 100%);color:var(--paper)}
.hero h1{color:#E4EEF2;font-family:var(--display);font-weight:600;font-size:clamp(64px,14vw,190px);letter-spacing:.16em;margin-right:-.16em;line-height:1;animation:heroIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.pill{display:inline-flex;align-items:center;gap:14px;margin-top:34px;background:var(--paper);color:var(--wine);border-radius:999px;padding:14px 30px;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(15px,2vw,22px);box-shadow:0 14px 40px rgba(0,0,0,.28);animation:heroIn 1.2s .35s cubic-bezier(.2,.8,.2,1) both}
.pill svg{width:22px;height:22px;stroke:var(--wine);fill:none;stroke-width:2.2;stroke-linecap:round}
@keyframes heroIn{from{opacity:0;transform:translateY(30px) scale(.96)}}
.scrollcue{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:2;font-family:var(--display);font-size:13px;letter-spacing:.3em;color:var(--gold-l);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollcue i{width:2px;height:34px;background:linear-gradient(var(--gold-l),transparent);animation:cue 1.6s ease-in-out infinite}
@keyframes cue{from{transform:scaleY(.3);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
.snow{position:absolute;inset:0;z-index:1;pointer-events:none}
.snow span{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) translateX(30px)}}
/* timeline */
.timeline{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;padding-bottom:56px}
.timeline .line{position:absolute;left:0;right:0;bottom:18px;height:4px;background:var(--wine);border-radius:2px;transform-origin:left}
.pol{position:relative;background:var(--paper);padding:10px 10px 14px;border-radius:6px;box-shadow:0 14px 36px rgba(43,29,25,.18);display:flex;flex-direction:column;gap:10px}
.pol img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:3px;display:block}
.pol .cap{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--wine);text-transform:uppercase;text-align:center}
.timeline .pol:nth-child(odd){transform:rotate(-2.5deg)} .timeline .pol:nth-child(even){transform:rotate(2deg) translateY(-22px)}
.timeline .pol::after{content:"";position:absolute;left:50%;bottom:-48px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--blue);border:3px solid var(--wine)}
.timeline .pol:nth-child(even)::after{bottom:-70px}
.pol:hover{z-index:3}
/* video */
.vid-row{display:grid;grid-template-columns:minmax(0,1.1fr) auto auto;gap:36px;align-items:center}
.phone{border:10px solid #0E0708;border-radius:38px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);background:#0E0708}
.phone video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.ph-main{width:min(330px,70vw)} .ph-sm{width:200px}
.ph-cap{margin-top:12px;text-align:center;font-family:var(--display);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-l)}
.vid-side{display:flex;flex-direction:column;gap:28px}
.vid-side .ph-wrap:nth-child(2){margin-left:40px}
.quote{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.6vw,60px);line-height:1.06;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
/* segmentation */
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,400px);gap:56px;align-items:center}
.seg .card{flex-direction:row;align-items:center;gap:16px;padding:20px 22px}
.seg .card .k{font-size:14px;color:var(--muted)}
.seg .card .lbl{font-size:17px}
.lucy{display:flex;flex-direction:column;align-items:center;gap:0;animation:sway 5s ease-in-out infinite alternate}
.lucy img{width:100%;height:auto;display:block}
.lucy .name{font-size:clamp(56px,7vw,84px);line-height:1}
/* kpis */
.num{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.2vw,52px);line-height:1.05;color:var(--wine);font-variant-numeric:tabular-nums}
.kp .lbl{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:17px;color:var(--ink)}
.card.inv .num{color:var(--paper)}
/* results */
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:64px;align-items:center}
.big11{width:clamp(220px,28vw,340px);aspect-ratio:1;border-radius:50%;background:var(--paper);border:10px solid var(--blue);outline:2px solid var(--ring);outline-offset:6px;color:var(--wine);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;padding:20px}
.big11 .n{font-family:var(--display);font-weight:700;font-size:clamp(96px,13vw,160px);line-height:.9}
.big11 .t{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase}
.res p.lead{font-size:clamp(19px,2vw,24px);line-height:1.6;color:var(--on-wine);max-width:62ch}
/* expect */
.lines{display:flex;flex-direction:column;gap:34px;max-width:760px;margin:30px auto 0}
.lines p{border-bottom:2px solid var(--blue);min-height:52px;padding:10px 4px;font-size:22px;font-family:var(--script);font-style:italic;font-weight:600;color:var(--wine);transform-origin:left}
/* gifts */
.gifts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center}
.gifts .pol{animation:sway 5s ease-in-out infinite alternate}
.gifts .pol img{aspect-ratio:3/4}
.gifts .pol:nth-child(3){animation-duration:6s;animation-direction:alternate-reverse;margin-top:80px}
/* thanks */
.thanks{text-align:center}
.thanks h2{font-family:var(--display);font-weight:700;font-size:clamp(52px,13vw,200px);letter-spacing:.04em;line-height:1}
.thanks p{margin-top:20px;font-family:var(--display);font-weight:600;letter-spacing:.5em;color:var(--blue);font-size:22px}
.ring{position:absolute;left:50%;top:50%;z-index:1;width:clamp(300px,58vw,700px);aspect-ratio:1;border-radius:50%;border:3px solid rgba(188,208,216,.75);transform:translate(-50%,-50%);box-shadow:0 0 0 14px rgba(213,219,224,.08),inset 0 0 80px rgba(188,208,216,.12);animation:breathe 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes breathe{from{transform:translate(-50%,-50%) scale(.97)}to{transform:translate(-50%,-50%) scale(1.02)}}
.flake{width:30px;height:30px;stroke:var(--blue-d);fill:none;stroke-width:2;stroke-linecap:round;animation:spin 14s linear infinite}
.b-wine .flake,.b-night .flake,.hero .flake{stroke:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.thanks .ring{width:clamp(280px,48vw,560px)}
/* side nav + progress */
.prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--gold);z-index:40}
.dots{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:40}
.dots a{width:11px;height:11px;border-radius:50%;background:rgba(188,208,216,.45);border:2px solid var(--blue-d);display:block}
.dots a.on{background:var(--blue-d);transform:scale(1.25)}
.dots a:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
/* editing */
.tools{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.btn{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;background:var(--wine);color:var(--paper);box-shadow:0 10px 30px rgba(43,29,25,.3)}
.btn.ghost{background:var(--paper);color:var(--wine)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:default}
.hint{background:var(--ink);color:var(--paper);font-size:14px;padding:10px 16px;border-radius:14px;max-width:340px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;z-index:60;font-size:15px;max-width:calc(100vw - 32px)}
[data-k]{white-space:pre-line}
body.editing [data-k]{outline:2px dashed rgba(199,154,62,.8);outline-offset:4px;border-radius:4px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--gold);background:rgba(235,203,133,.16)}
body.editing .lines p:empty::before{content:"Escribe aquí…";opacity:.45}
.grip{display:none}
body.editing [data-item]>.grip{display:grid;place-items:center;position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--ink);cursor:grab;touch-action:none;z-index:5;font-size:18px;line-height:1}
body.editing [data-item].dragging{opacity:.55;transform:scale(.97)}
body.editing .rv,body.editing .rv-pop,body.editing .line-draw{animation:none}
body.editing .deco,body.editing .lucy,body.editing .gifts .pol{animation-play-state:paused}

/* AIDA */
.aida-bar{display:flex;height:46px;border-radius:999px;overflow:hidden;box-shadow:0 8px 24px rgba(85,122,140,.18);margin-bottom:10px}
.aida-bar span{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:14px;text-transform:uppercase;color:var(--paper);white-space:nowrap;overflow:hidden}
.aida-bar .sa{background:var(--wine)} .aida-bar .si{background:var(--blue-d)} .aida-bar .sd{background:var(--gold);color:var(--ink)} .aida-bar .sx{background:var(--night)}
.aida-bar b{font-weight:700} .aida-bar .short{display:none}
.aida-ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:44px}
.stages{display:flex;flex-direction:column;gap:24px}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;padding:26px}
.stage .letter{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:44px;color:var(--paper);background:var(--wine);flex:none}
.stage.si .letter{background:var(--blue-d)} .stage.sd .letter{background:var(--gold);color:var(--ink)} .stage.sx .letter{background:var(--night)}
.stage .body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.stage .lbl{font-size:24px}
.stage .time{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.2em;color:var(--blue-d);text-transform:uppercase}
.stage h4{margin:6px 0 4px;font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
.stage .txt{font-size:16.5px}
.thumbs{display:flex;gap:10px}
.thumbs img{width:92px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;box-shadow:0 8px 20px rgba(43,29,25,.18);display:block}
.aida-intro{max-width:70ch;font-size:18px;color:var(--muted);margin-top:-18px;margin-bottom:34px}
.sources{margin-top:30px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.sources a{color:var(--blue-d)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)} .stage .body{grid-template-columns:minmax(0,1fr)} .aida-bar span{font-size:11px;letter-spacing:.06em} .aida-bar .full{display:none} .aida-bar .short{display:inline}}
@media (max-width:900px){
  .g3{grid-template-columns:minmax(0,1fr)} .g2{grid-template-columns:minmax(0,1fr)}
  .timeline{grid-template-columns:repeat(2,minmax(0,1fr))} .timeline .line,.timeline .pol::after{display:none}
  .timeline .pol:nth-child(even){transform:rotate(2deg)}
  .vid-row,.seg,.res,.gifts{grid-template-columns:minmax(0,1fr);justify-items:center}
  .vid-side{flex-direction:row;flex-wrap:wrap;justify-content:center} .vid-side .ph-wrap:nth-child(2){margin-left:0}
  .ph-sm{width:150px} .gifts .pol:nth-child(3){margin-top:0}
  .deco.boot{opacity:.45;max-width:110px} .dots{display:none}
  .res{text-align:center}
}


/* CTA flow */
.cta-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-bottom:34px}
.cta-flow .step{flex:1 1 160px;background:var(--sand);border-radius:16px;padding:14px 16px;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.cta-flow .step b{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.cta-flow .step.hot{background:var(--wine);color:var(--cream2)} .cta-flow .step.hot b{color:var(--gold-l)}
.cta-flow i{align-self:center;font-style:normal;color:var(--wine);font-size:22px}
.tag{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.card.inv .tag{color:var(--gold-l)}
.cta-notes{margin-top:22px}
.card.note{background:var(--sand);border-color:transparent}
.card.note.warn{background:var(--cream2);border:1.5px dashed var(--gold)}
.card.note .tag{color:var(--wine)}
@media (max-width:900px){.cta-flow i{display:none}}
/* ===== v2: retro-editorial type and awning stripes ===== */
:root{--sand:#D6E6EC; --cream:#FFF7EC; --cream2:#FFEED7; --hi:#CEE3E9;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Bricolage Grotesque',system-ui,Arial,sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace; --brand:'Josefin Sans',Futura,'Trebuchet MS',sans-serif; --script:'Fraunces',Georgia,serif}
body{font-family:var(--body)}
#root{counter-reset:sec}
.band{counter-increment:sec}
.title{font-family:var(--display);font-weight:800;text-transform:none;letter-spacing:-.025em;line-height:.95;font-size:clamp(50px,8.4vw,116px);font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}
.eyebrow{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.head .eyebrow::before{content:attr(data-n) "  ✦  ";color:var(--wine)}
.b-wine .head .eyebrow::before,.b-night .head .eyebrow::before{color:var(--gold-l)}
.script{font-family:var(--display);font-style:italic;font-weight:500;font-variation-settings:"SOFT" 100,"WONK" 1}
.card{box-shadow:none;border:1.5px solid rgba(122,31,45,.16);border-radius:20px}
.card .lbl{font-family:var(--display);font-weight:700;text-transform:none;letter-spacing:-.01em;font-size:23px;line-height:1.1;font-variation-settings:"SOFT" 100}
.kp .lbl{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-d)}
.card.inv .lbl,.card.dark .lbl{color:var(--gold-l)}
.num,.big11 .n{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"opsz" 144}
.big11 .t,.ph-cap,.pol .cap,.stage .time,.aida-bar span,.aida-ticks,.scrollcue,.sources{font-family:var(--mono);font-weight:500;letter-spacing:.08em}
.pol .cap{font-size:13px}
.quote{font-family:var(--display);font-weight:700;text-transform:none;letter-spacing:-.02em;font-size:clamp(40px,5.4vw,72px);font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1}

/* hero: light blue with an awning-striped panel, like a shop front */
.hero{background:var(--sand);color:var(--wine);place-items:center start;text-align:left}
.hero .wrap{width:100%;max-width:calc(60% - 24px);margin:0;padding-left:clamp(0px,4vw,96px)}

.hero-stripes::before{content:"";position:absolute;left:-18px;top:0;bottom:0;width:20px;background:radial-gradient(circle at 0 17px,transparent 15px,var(--wine) 16px) 0 0/20px 34px repeat-y}
.hero .snow span{background:#fff;box-shadow:0 0 0 1px rgba(85,122,140,.15)}
.scrollcue{color:var(--wine)} .scrollcue i{background:linear-gradient(var(--wine),transparent)}
/* awning stripes on top of some bands */
.band.striped{padding-top:calc(clamp(72px,10vw,130px) + 44px)}
.band.striped::before{content:"";position:absolute;left:0;right:0;top:0;height:40px;z-index:1;background:repeating-linear-gradient(90deg,var(--wine) 0 28px,var(--cream2) 28px 56px)}
.band.striped::after{content:"";position:absolute;left:0;right:0;top:40px;height:14px;z-index:1;background:radial-gradient(circle at 14px 0,var(--wine) 13px,transparent 14px) 0 0/56px 14px repeat-x,radial-gradient(circle at 42px 0,var(--cream2) 13px,transparent 14px) 0 0/56px 14px repeat-x}
/* side label, like a printed brand guide */
@media (min-width:1500px){

}
@media (max-width:900px){

  .hero img.deco.boot:nth-of-type(n+3){display:none}

/* ===== v3: slide deck mode ===== */
html{scroll-behavior:auto}
body{overflow:hidden;height:100%}
#root{position:fixed;inset:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
#root>section.band{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;justify-content:center;justify-content:safe center;padding-bottom:calc(clamp(72px,10vw,130px) + 40px);content-visibility:visible;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#root>section.band.is-on{display:flex;animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
#root>section.band.is-on.back{animation-name:slideInBack}
#root>section.hero.is-on{display:grid;justify-content:stretch;align-content:center;grid-template-columns:minmax(0,1fr)}
.hero .pill{white-space:nowrap}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}
@keyframes slideInBack{from{opacity:0;transform:translateX(-40px)}}
.band .wrap{width:100%}
.rv,.rv-pop,.line-draw{animation:none}
.is-on .rv{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 90ms + 120ms)}
.is-on .rv-pop{animation:pop .65s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--d,0) * 90ms + 120ms)}
.is-on .line-draw{animation:drawx 1s cubic-bezier(.6,0,.2,1) both;animation-delay:.3s}
.lucy.rv-pop,.gifts .pol.rv-pop{animation:sway 5s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.prog{transition:transform .4s ease}
.dots{gap:9px}
.nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:8px;background:rgba(255,247,236,.92);border:1.5px solid rgba(122,31,45,.18);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(43,29,25,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav button{width:46px;height:46px;border-radius:50%;border:0;background:var(--wine);color:var(--cream2);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.nav button[disabled]{opacity:.3;cursor:default}
.nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav .count{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--wine);min-width:150px;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .count b{font-weight:500;color:var(--blue-d)}
.tools{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.camp{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:46}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,14,16,.86);display:grid;place-items:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal .box{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%}
.modal video{height:min(78vh,760px);max-width:calc(100vw - 40px);aspect-ratio:9/16;object-fit:contain;border-radius:22px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .mt{font-family:var(--display);font-style:italic;font-weight:600;color:var(--cream2);font-size:26px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;max-width:900px}
.refs li{padding-left:2.2em;text-indent:-2.2em;font-size:17px;line-height:1.55;color:var(--ink)}
.refs a{color:var(--blue-d);word-break:break-all}
@media (max-width:900px){
  .nav .count{min-width:0;max-width:120px}
  .camp .btn,body:not(.editing) .tools .btn{width:50px;height:50px;padding:0;border-radius:50%;font-size:0;display:grid;place-items:center}
  .camp .btn::before{content:"▶";font-size:18px}
  body:not(.editing) .tools .btn::before{content:"✎";font-size:20px}
  .tools .btn{padding:11px 14px;font-size:12px}
  body.editing .tools{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
  #root>section.band{padding-bottom:150px}
}

/* ===== v4: KPI charts, fullscreen, no-overlap guards ===== */

.axis{display:flex;justify-content:space-between;margin-left:52px;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px dashed rgba(85,122,140,.4);padding-top:4px}

/* ===== v6: editorial AIDA, hook, CTA, results ===== */

/* ===== v7: compact, hideable controls ===== */
:root{--bar:50px}
.nav button{width:36px;height:36px;font-size:17px}
.nav{bottom:calc(env(safe-area-inset-bottom,0px) + 7px);gap:6px}
.nav .count{font-size:12px;min-width:120px}
.camp,.tools{bottom:calc(env(safe-area-inset-bottom,0px) + 7px)}
.camp{gap:6px}
.camp .btn,body:not(.editing) .tools .btn,.hidebtn{width:36px;height:36px;padding:0;border-radius:50%;font-size:16px;display:grid;place-items:center;letter-spacing:0}
.camp .btn::before,body:not(.editing) .tools .btn::before{content:none!important}
.camp .btn.fs{background:var(--paper);color:var(--wine);border:1.5px solid rgba(122,31,45,.2)}
.tools{right:max(60px,calc(env(safe-area-inset-right,0px) + 60px))}
.hidebtn{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 7px);z-index:47;border:1.5px solid rgba(122,31,45,.2);background:var(--paper);color:var(--wine);cursor:pointer}
.hidebtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.clean #root{bottom:0}
body.clean .ctrlbar,body.clean .nav,body.clean .camp,body.clean .tools,body.clean .dots,body.clean .prog{display:none}
body.clean .hidebtn{opacity:.25;transition:opacity .2s}
body.clean .hidebtn:hover,body.clean .hidebtn:focus-visible{opacity:1}
@media (max-width:900px){
  .camp .btn,body:not(.editing) .tools .btn{width:36px;height:36px;font-size:16px}
  .camp,.tools{bottom:calc(env(safe-area-inset-bottom,0px) + 7px)}
  body.editing .tools{bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 10px)}
}

/* ===== v8: softer rose palette (replaces steel blue, gold and near-black accents) ===== */
:root{--blue-d:#B4475E; --gold:#E39AA8; --gold-l:#F7CDD5; --night:#4E1824; --ink:#3A1A1F; --muted:#6E5359; --hi:#F9DDE2}

    slides.forEach(function(sl,j){sl.classList.toggle("is-on",j===i);sl.classList.toggle("back",j===i&&dir<0);sl.setAttribute("aria-hidden",j===i?"false":"true")});
    var sl=slides[i]; sl.scrollTop=0;
    slides.forEach(function(x,j){var e=x.querySelector(".head .eyebrow"); if(e) e.setAttribute("data-n",String(j+1).padStart(2,"0"))});
    var n=0; sl.querySelectorAll(".rv,.rv-pop").forEach(function(el){el.style.setProperty("--d",Math.min(n++,8))});
    if(!instant&&!editing){sl.classList.remove("is-on");void sl.offsetWidth;sl.classList.add("is-on")}
    [i+1,i-1].forEach(function(k){if(slides[k]) slides[k].querySelectorAll('img[loading="lazy"]').forEach(function(im){im.loading="eager"})});
    sl.querySelectorAll('img[loading="lazy"]').forEach(function(im){im.loading="eager"});
    cur=i; prog.style.transform="scaleX("+((i+1)/slides.length)+")";
    dots.querySelectorAll("a").forEach(function(a,j){a.classList.toggle("on",j===i)});
    var name=SECTIONS[i]?SECTIONS[i][1]:"";
    countEl.innerHTML=""; var b=document.createElement("b"); b.textContent=(i+1)+" / "+slides.length; countEl.appendChild(b); countEl.appendChild(document.createTextNode("  "+name));
    prevB.disabled=i===0; nextB.disabled=i===slides.length-1;
    try{history.replaceState(null,"","#"+sl.id)}catch(e){}
    fit(sl); declutter(sl); declutterSoon();
    sl.querySelectorAll("[data-count]").forEach(function(el){if(countObs) {countObs.unobserve(el);countObs.observe(el)}});
  }
  function go(d){ if(document.querySelector(".modal")) return; show(cur+d,d) }
  var bar=document.createElement("div"); bar.className="ctrlbar"; bar.setAttribute("aria-hidden","true"); document.body.appendChild(bar);
  var nav=document.createElement("nav"); nav.className="nav"; nav.setAttribute("aria-label","Cambiar de diapositiva");
  var prevB=document.createElement("button"); prevB.type="button"; prevB.textContent="←"; prevB.setAttribute("aria-label","Diapositiva anterior"); prevB.addEventListener("click",function(){go(-1)});
  var countEl=document.createElement("span"); countEl.className="count"; countEl.setAttribute("aria-live","polite");
  var nextB=document.createElement("button"); nextB.type="button"; nextB.textContent="→"; nextB.setAttribute("aria-label","Siguiente diapositiva"); nextB.addEventListener("click",function(){go(1)});
  nav.appendChild(prevB); nav.appendChild(countEl); nav.appendChild(nextB); document.body.appendChild(nav);
  dots.addEventListener("click",function(e){var a=e.target.closest("a"); if(!a) return; e.preventDefault(); var k=[].indexOf.call(dots.children,a); show(k,k>cur?1:-1)});
  window.addEventListener("hashchange",function(){var h=location.hash.slice(1),k=SECTIONS.findIndex(function(x){return x[0]===h}); if(k>=0&&k!==cur) show(k,k>cur?1:-1)});
  document.addEventListener("keydown",function(e){
    if(editing&&document.activeElement&&document.activeElement.isContentEditable) return;
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.key==="Escape"){closeModal();return}
    if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(1)}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1)}
  });
  var tx=null,ty=null;
  root.addEventListener("touchstart",function(e){if(editing) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY},{passive:true});
  root.addEventListener("touchend",function(e){if(tx===null) return; var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4) go(dx<0?1:-1)},{passive:true});
  /* full campaign video */
  var camp=document.createElement("div"); camp.className="camp";
  var cb=document.createElement("button"); cb.type="button"; cb.className="btn"; cb.textContent="▶"; cb.title="Ver la campaña completa"; cb.setAttribute("aria-label","Ver la campaña completa"); cb.addEventListener("click",openModal); camp.appendChild(cb); document.body.appendChild(camp);
  var fsOk=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  if(fsOk){var fb=document.createElement("button"); fb.type="button"; fb.className="btn ghost fs"; fb.setAttribute("aria-label","Pantalla completa");
    var fsLabel=function(){var on=!!(document.fullscreenElement||document.webkitFullscreenElement); fb.textContent=on?"✕":"⛶"; fb.title=on?"Salir de pantalla completa":"Pantalla completa"; fb.setAttribute("aria-label",on?"Salir de pantalla completa":"Pantalla completa")};
    fb.addEventListener("click",function(){var el=document.documentElement;
      try{ if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
        else{var r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(r&&r.catch) r.catch(function(){toast("Tu navegador no permitió la pantalla completa aquí.")})} }catch(e){toast("Tu navegador no permitió la pantalla completa aquí.")} });
    document.addEventListener("fullscreenchange",function(){fsLabel();declutterSoon()}); document.addEventListener("webkitfullscreenchange",fsLabel);
    fsLabel(); camp.appendChild(fb);}
  var hb=document.createElement("button"); hb.type="button"; hb.className="hidebtn";
  function setClean(on){document.body.classList.toggle("clean",on); hb.textContent=on?"⌃":"⌄"; hb.title=on?"Mostrar controles":"Ocultar controles"; hb.setAttribute("aria-label",hb.title); try{localStorage.setItem("bh-clean",on?"1":"0")}catch(e){} setTimeout(refit,60)}
  hb.addEventListener("click",function(){setClean(!document.body.classList.contains("clean"))});
  document.body.appendChild(hb);
  var startClean=false; try{startClean=localStorage.getItem("bh-clean")==="1"}catch(e){} setClean(startClean);
  document.addEventListener("keydown",function(e){if((e.key==="h"||e.key==="H")&&!(document.activeElement&&document.activeElement.isContentEditable)&&!editing) setClean(!document.body.classList.contains("clean"))});
  function openModal(){
    if(document.querySelector(".modal")) return;
    root.querySelectorAll("video").forEach(function(v){v.pause()});
    var m=document.createElement("div"); m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Campaña completa");
    var box=document.createElement("div"); box.className="box";
    var t=document.createElement("p"); t.className="mt"; t.textContent="Campaña completa · La Navidad llegó a Bhriela";
    var v=document.createElement("video"); v.src="/_blob/f79e4a5e59bf8816edca61c1e61b8ba9"; v.poster="/_blob/62b87bd8cc18f62477228ba5996a4917"; v.controls=true; v.playsInline=true; v.preload="auto";
    var x=document.createElement("button"); x.type="button"; x.className="btn ghost"; x.textContent="Cerrar"; x.addEventListener("click",closeModal);
    box.appendChild(t); box.appendChild(v); box.appendChild(x); m.appendChild(box);
    m.addEventListener("click",function(e){if(e.target===m) closeModal()});
    document.body.appendChild(m); x.focus();
    playVid(v);
  }
  function closeModal(){var m=document.querySelector(".modal"); if(!m) return; var v=m.querySelector("video"); if(v) v.pause(); m.remove(); cb.focus()}

  

  /* editing toolbar */
  var tools=document.createElement("div"); tools.className="tools"; document.body.appendChild(tools);
  var toastEl=null,toastT=null;
  function toast(msg){if(!toastEl){toastEl=document.createElement("div");toastEl.className="toast";toastEl.setAttribute("role","status");document.body.appendChild(toastEl)}
    toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},3500)}
  function button(label,cls,fn){var b=document.createElement("button");b.type="button";b.className="btn"+(cls?" "+cls:"");b.textContent=label;b.addEventListener("click",fn);return b}
  function drawTools(){
    tools.textContent="";
    if(!artifact||readOnly) return;
    if(!editing){var eb=button("✎","",startEdit);eb.setAttribute("aria-label","Editar");eb.title="Editar";tools.appendChild(eb);return}
    var h=document.createElement("div");h.className="hint";h.textContent="Toca cualquier texto para cambiarlo. Arrastra el ⠿ de una tarjeta para moverla.";tools.appendChild(h);
    tools.appendChild(button("Cancelar","ghost",cancelEdit));
    var s=button(saving?"Guardando…":"Guardar","",save); s.disabled=saving; tools.appendChild(s);
  }
  function setEditable(on){
    root.querySelectorAll("[data-k]").forEach(function(el){
      if(on){try{el.contentEditable="plaintext-only"}catch(e){el.contentEditable="true"} if(el.contentEditable!=="plaintext-only") el.contentEditable="true"; el.spellcheck=true}
      else el.removeAttribute("contenteditable");
    });
  }
  function startEdit(){document.body.classList.remove("clean");editing=true;document.body.classList.add("editing");render();setEditable(true);drawTools();}
  function cancelEdit(){editing=false;document.body.classList.remove("editing");render();drawTools();toast("Cambios descartados")}
  root.addEventListener("paste",function(e){if(!editing) return; var t=e.target.closest&&e.target.closest("[data-k]"); if(!t||t.contentEditable==="plaintext-only") return;
    e.preventDefault(); var txt=(e.clipboardData||window.clipboardData).getData("text"); document.execCommand("insertText",false,txt);});
  root.addEventListener("keydown",function(e){if(editing&&e.key==="Enter"&&e.target.closest&&e.target.closest("h1,h2,h3,.lbl,.cap,.num,.eyebrow,.k")){e.preventDefault()}});

  /* drag to reorder cards (pointer events: mouse and touch) */
  var drag=null;
  root.addEventListener("pointerdown",function(e){
    if(!editing) return; var g=e.target.closest&&e.target.closest(".grip"); if(!g) return;
    var item=g.parentElement, box=item.parentElement; e.preventDefault();
    drag={item:item,box:box,id:e.pointerId}; item.classList.add("dragging"); g.setPointerCapture(e.pointerId);
  });
  root.addEventListener("pointermove",function(e){
    if(!drag||e.pointerId!==drag.id) return;
    var sibs=[].slice.call(drag.box.children).filter(function(c){return c!==drag.item&&c.hasAttribute("data-item")});
    for(var i=0;i<sibs.length;i++){var r=sibs[i].getBoundingClientRect();
      if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){
        var before=(e.clientY<r.top+r.height/2)||(r.height>r.width*1.4?false:e.clientX<r.left+r.width/2&&e.clientY<r.bottom);
        drag.box.insertBefore(drag.item,before?sibs[i]:sibs[i].nextSibling); break;}}
  });
  function endDrag(e){if(!drag||e.pointerId!==drag.id) return; drag.item.classList.remove("dragging"); drag=null;}
  root.addEventListener("pointerup",endDrag); root.addEventListener("pointercancel",endDrag);

  /* save: rebuild the whole document from state and publish it */
  function collect(){
    var s={texts:{},order:{}};
    var base=document.createElement("div"); base.appendChild(tpl.content.cloneNode(true));
    root.querySelectorAll("[data-k]").forEach(function(el){
      var k=el.getAttribute("data-k"), v=el.innerText.replace(/ /g," ").replace(/\n{3,}/g,"\n\n").replace(/^\s+|\s+$/g,"");
      var orig=base.querySelector('[data-k="'+k+'"]'); var o=orig?orig.textContent.replace(/^\s+|\s+$/g,""):"";
      if(v!==o) s.texts[k]=v;
    });
    root.querySelectorAll("[data-sort]").forEach(function(box){
      s.order[box.getAttribute("data-sort")]=[].slice.call(box.children).filter(function(c){return c.hasAttribute("data-item")}).map(function(c){return c.getAttribute("data-item")});
    });
    return s;
  }
  function buildDoc(s){
    var json=JSON.stringify(s).replace(/</g,"\\u003c");
    var sc="<"+"/script>";
    var fonts=document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+RESET+"</style></head><body>"+
      "<title>Bhriela Campaña Meta Ads</title><meta name=\"claude:viewport-fit-sides\" content=\"cover\"><link rel=\"stylesheet\" href=\""+(fonts?fonts.getAttribute("href"):"")+"\">"+
      "<style id=\"st\">"+document.getElementById("st").textContent+"</style><div id=\"root\"></div><template id=\"tpl\">"+tpl.innerHTML+"</template>"+
      "<script type=\"application/json\" id=\"state\">"+json+sc+"<script id=\"app\">"+document.getElementById("app").textContent+sc+"</body></html>";
  }
  function save(){
    if(saving) return; var s=collect(); saving=true; drawTools();
    artifact.publish(buildDoc(s)).then(function(){
      state=s; saving=false; editing=false; document.body.classList.remove("editing"); render(); drawTools(); toast("Guardado. Todos verán esta versión.");
    }).catch(function(err){
      saving=false; var c=err&&err.code;
      if(c==="conflict"){toast("Alguien guardó otra versión antes. La página se está recargando con esa versión.")}
      else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"){readOnly=true;editing=false;document.body.classList.remove("editing");render();toast("Esta vista es de solo lectura: no puedes guardar cambios.")}
      else if(c==="rate_limited"){toast("Se guardó hace muy poco. Espera unos segundos y vuelve a intentar.")}
      else if(c==="too_large"){toast("La página quedó demasiado grande para guardarse.")}
      else {toast("No se pudo guardar. Intenta de nuevo en un momento.")}
      drawTools();
    });
  }

  render(); drawTools();
  if(window.claude&&window.claude.use){window.claude.use("artifact").then(function(a){artifact=a; drawTools();}).catch(function(){});}
})();
</script>
