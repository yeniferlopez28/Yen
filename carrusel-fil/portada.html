<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FIL Guadalajara: un caso de marketing</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --crema:#FCF1DD; --naranja:#EE8A55; --rosa:#F2A9BE; --vino:#7A1F3D; --vinot:#5E1A33;
    --azul:#7C9BD3; --lima:#E4EB9C; --oliva:#6B7027; --gris:#9A8F86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333;display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px 0}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--crema);font-family:Montserrat,sans-serif;color:var(--vinot)}
  .abs{position:absolute}
  .blob{position:absolute;border-radius:50%;background:var(--rosa);opacity:.35}
  .url{position:absolute;left:0;right:0;top:54px;text-align:center;font:500 19px Montserrat;letter-spacing:5px;color:var(--gris);z-index:5}
  .wrap{position:absolute;left:72px;right:72px;top:118px;z-index:3}

  /* tiras de título */
  .tt{display:flex;flex-direction:column;align-items:flex-start}
  .st{display:inline-block;font:800 66px/1 Montserrat;text-transform:uppercase;letter-spacing:1.5px;padding:15px 26px 11px;white-space:nowrap;position:relative}
  .st.o{background:var(--naranja);color:var(--crema)}
  .st.pk{background:var(--rosa);color:var(--vino)}
  .st.b{background:var(--azul);color:var(--crema)}
  .st.w{background:var(--vino);color:var(--crema)}
  .st.l{background:var(--lima);color:var(--vino)}
  .cut1{clip-path:polygon(0 6%,100% 0,99% 100%,1% 94%)}
  .cut2{clip-path:polygon(1% 0,99% 5%,100% 96%,0 100%)}
  .cut3{clip-path:polygon(0 0,100% 4%,98% 100%,2% 97%)}
  .sc{font-family:Satisfy,cursive;font-size:128px;line-height:1;color:var(--vino);-webkit-text-stroke:2.5px currentColor;position:relative;z-index:4;white-space:nowrap}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:112px;height:112px;background:var(--vino);color:var(--crema);font:800 78px/1 Montserrat;clip-path:polygon(8% 4%,96% 0,100% 92%,0 100%);transform:rotate(-6deg)}

  /* texto */
  .lead{font:700 44px/1.22 Montserrat;color:var(--vino);letter-spacing:-.2px}
  .tx{font:500 31px/1.42 Montserrat;color:var(--vinot);margin-top:24px}
  .tx b,.lead b{font-weight:800;color:var(--vino)}
  mark{background:linear-gradient(180deg,transparent 52%,rgba(242,169,190,.85) 52%,rgba(242,169,190,.85) 92%,transparent 92%);color:inherit;padding:0 3px}
  mark.l{background:linear-gradient(180deg,transparent 52%,var(--lima) 52%,var(--lima) 92%,transparent 92%)}

  /* tarjeta de definición */
  .def{position:relative;background:var(--vino);color:var(--crema);padding:48px 42px 36px;font:500 29px/1.42 Montserrat;clip-path:polygon(0 2%,100% 0,99.5% 100%,.5% 98%)}
  .def b{font-weight:800;color:var(--lima)}
  .defw{position:relative;margin-top:30px}
  .slide .defw{margin-top:70px !important}
  .tag{position:absolute;left:28px;top:-26px;z-index:2;background:var(--lima);color:var(--vino);font:800 22px/1 Montserrat;letter-spacing:2px;text-transform:uppercase;padding:12px 18px 10px;transform:rotate(-3deg);clip-path:polygon(0 6%,100% 0,98% 100%,2% 94%)}
  .def .term{display:block;font-family:Satisfy;font-size:68px;line-height:1.05;color:var(--rosa);-webkit-text-stroke:1px currentColor;margin-bottom:8px}

  .stk{position:absolute;z-index:6;filter:drop-shadow(0 10px 14px rgba(94,26,51,.18))}
  svg.d{position:absolute;overflow:visible;z-index:2}
  svg.d.top{z-index:7}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="spark" viewBox="0 0 100 100"><path d="M50 0C54 38 62 46 100 50C62 54 54 62 50 100C46 62 38 54 0 50C38 46 46 38 50 0Z"/></symbol>
  <symbol id="arrow" viewBox="0 0 200 90"><ellipse cx="98" cy="50" rx="92" ry="22" fill="#E4EB9C" transform="rotate(-3 98 50)"/><path d="M14 46C60 41 110 43 168 45" fill="none" stroke="#6B7027" stroke-width="7" stroke-linecap="round"/><path d="M140 20L172 45L141 70" fill="none" stroke="#6B7027" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<!-- ============ 01 PORTADA ============ -->
<section class="slide" id="s1">
  <div class="url">@BYENSITAMKT</div>
  <svg class="d scallop" data-c="#EE8A55" data-r="34" style="left:52px;top:118px" width="976" height="1060"></svg>
  <div class="wrap" style="top:200px;left:118px">
    <div class="tt">
      <span class="st b cut1" style="font-size:60px;transform:rotate(-2deg)">LA FIL GUADALAJARA</span>
      <span class="sc" style="color:var(--crema);font-size:118px;margin:-14px 0 -20px 30px;transform:rotate(-4deg)">es mucho más</span>
      <span class="st w cut2" style="font-size:42px;margin-left:10px;transform:rotate(1.5deg)">QUE UNA FERIA DE LIBROS.</span>
    </div>
    <div class="tt" style="margin-top:62px">
      <span class="st pk cut3" style="font-size:72px;transform:rotate(-1.5deg)">ES TODO UN</span>
      <span class="st b cut1" style="font-size:72px;margin:6px 0 0 70px;transform:rotate(1deg)">CASO DE</span>
      <span class="sc" style="color:var(--vino);font-size:170px;margin:-52px 0 0 30px;transform:rotate(-5deg)">marketing</span>
    </div>
  </div>
  <div class="abs" style="left:122px;top:925px;width:430px;z-index:4;font:600 25px/1.42 Montserrat;color:var(--crema)">Comunidad, experiencias, creadores de contenido y estrategias para reunir a miles de personas alrededor de la literatura.</div>
  <img class="stk" src="cut/lee-audifonos.png" style="left:585px;top:780px;width:480px">
  <svg class="d burst top" data-c="#E4EB9C" style="left:870px;top:150px" width="150" height="150"></svg>
  <svg class="d star8" data-c="#F2A9BE" style="left:690px;top:540px" width="90" height="90"></svg>
  <svg class="d top" style="left:930px;top:690px" width="60" height="60" fill="#6B7027"><use href="#spark"/></svg>
  <svg class="d" style="left:110px;top:1210px" width="60" height="60" fill="#F2A9BE"><use href="#spark"/></svg>
  <svg class="d top" style="left:120px;top:1110px" width="170" height="78"><use href="#arrow"/></svg>
  <div class="blob" style="left:20px;top:1240px;width:120px;height:120px"></div>
</section>
<script src="doodles.js"></script>
</body>
</html>
