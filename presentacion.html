<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIBO 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen horizontal deck; each block of the strategy owns one brand colour. */
:root {
  --red: #D6161D; --black: #0C0B0A; --cream: #F2EFE8; --blue: #3A5CFF; --lime: #C9F23A;
  --display: "Anton", "Arial Narrow", Impact, sans-serif;
  --sans: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--black); color: var(--cream); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }

.deck { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; }
.track { display: flex; height: 100%; transition: transform .7s cubic-bezier(.7,0,.2,1); will-change: transform; }
.slide {
  --bg: var(--lime); --fg: var(--black); --ac: var(--red); --ac2: var(--blue);
  flex: 0 0 100vw; height: 100%; position: relative; overflow: hidden;
  background: var(--bg); color: var(--fg);
  padding: clamp(64px, 9vh, 92px) max(clamp(16px, 4vw, 64px), env(safe-area-inset-right, 0px)) clamp(70px, 10vh, 96px) max(clamp(16px, 4vw, 64px), env(safe-area-inset-left, 0px));
  display: grid; grid-template-rows: auto 1fr; gap: clamp(14px, 2.4vh, 28px);
}
.t1 { --bg: var(--lime);  --fg: var(--black); --ac: var(--red);   --ac2: var(--blue); }
.t2 { --bg: var(--cream); --fg: var(--black); --ac: var(--blue);  --ac2: var(--red); }
.t3 { --bg: var(--blue);  --fg: var(--cream); --ac: var(--lime);  --ac2: var(--black); }
.t4 { --bg: var(--black); --fg: var(--cream); --ac: var(--lime);  --ac2: var(--red); }
.t5 { --bg: var(--red);   --fg: var(--cream); --ac: var(--lime);  --ac2: var(--black); }
.t6 { --bg: var(--cream); --fg: var(--black); --ac: var(--red);   --ac2: var(--blue); }

/* ---------- chrome ---------- */
.top {
  position: fixed; z-index: 20; inset: 0 0 auto 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(clamp(16px, 4vw, 64px), env(safe-area-inset-right, 0px)) 0 max(clamp(16px, 4vw, 64px), env(safe-area-inset-left, 0px));
  pointer-events: none; color: var(--chrome, var(--black)); transition: color .4s;
}
.top > * { pointer-events: auto; }
.logo { display: inline-block; height: 22px; aspect-ratio: 1200 / 562; background: currentColor;
  -webkit-mask: url("assets/fibo-logo.png") center / contain no-repeat; mask: url("assets/fibo-logo.png") center / contain no-repeat; }
.top__block { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; display: flex; gap: 10px; align-items: center; }
.top__block i { width: 10px; height: 10px; background: currentColor; display: inline-block; }
.top__right { display: flex; gap: 10px; align-items: center; }
.btn {
  font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  background: transparent; color: inherit; border: 1.5px solid currentColor; padding: 9px 12px; cursor: pointer;
}
.btn:hover, .btn:focus-visible { background: currentColor; outline: none; }
.btn:hover span, .btn:focus-visible span { filter: invert(1); mix-blend-mode: difference; }
.count { font: 700 13px/1 var(--mono); font-variant-numeric: tabular-nums; }

.bottom {
  position: fixed; z-index: 20; inset: auto 0 0 0;
  padding: 0 max(clamp(16px, 4vw, 64px), env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(clamp(16px, 4vw, 64px), env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  color: var(--chrome, var(--black)); transition: color .4s;
}
.nav { width: 46px; height: 46px; display: grid; place-items: center; border: 1.5px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.nav svg { width: 20px; height: 20px; fill: currentColor; shape-rendering: crispEdges; }
.nav:hover, .nav:focus-visible { background: currentColor; outline: none; }
.nav:hover svg, .nav:focus-visible svg { fill: var(--chrome-bg, var(--lime)); }
.progress { display: flex; gap: 2px; height: 8px; }
.progress b { flex: 1; background: currentColor; opacity: .18; transition: opacity .3s; cursor: pointer; }
.progress b.done { opacity: .55; }
.progress b.now { opacity: 1; }

/* ---------- slide content ---------- */
.head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; font: 700 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.head .n { background: var(--fg); color: var(--bg); padding: 5px 7px; }
.chip { border: 1.5px solid currentColor; padding: 4px 7px; font: 700 10px/1 var(--mono); letter-spacing: .1em; }
.chip--base { background: var(--ac); border-color: var(--ac); color: var(--bg); }
.chip--pend { border-style: dashed; }

.body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(20px, 4vw, 64px); align-items: center; min-height: 0; }
.body--wide { grid-template-columns: 1fr; align-content: center; }
.copy { display: grid; gap: clamp(12px, 2.2vh, 22px); min-width: 0; align-content: center; }
.title { font: 400 clamp(26px, 3.6vw, 58px)/.95 var(--display); text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
.msg { font: 500 clamp(17px, 1.6vw, 26px)/1.25 var(--sans); max-width: 34ch; text-wrap: balance; }
.pts { list-style: none; display: grid; gap: 10px; max-width: 46ch; }
.pts li { font-size: clamp(13px, 1.02vw, 16px); line-height: 1.35; padding-left: 18px; position: relative; }
.pts li::before { content: ""; position: absolute; left: 0; top: .45em; width: 8px; height: 8px; background: var(--ac); }
.pts b { font-weight: 700; }
.warn { font: 400 11px/1.4 var(--mono); opacity: .75; max-width: 52ch; }
.viz { min-width: 0; display: grid; align-content: center; gap: 14px; }
.src { font: 400 10px/1.4 var(--mono); opacity: .6; }

/* entrance: everything rests visible; the current slide replays the motion */
.a { transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .7s; }
.slide:not(.in) .a { transform: translateY(18px); opacity: 0; }
.slide.in .a { transition-delay: calc(var(--d, 0) * 70ms + 150ms); }

/* ---------- visual components ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 3px; }
.kpi { background: var(--fg); color: var(--bg); padding: clamp(14px, 2vw, 26px); display: grid; gap: 8px; align-content: space-between; min-height: clamp(120px, 20vh, 200px); }
.kpi:nth-child(3n+2) { background: var(--ac); color: var(--fg); }
.t4 .kpi:nth-child(3n+2), .t3 .kpi:nth-child(3n+2), .t5 .kpi:nth-child(3n+2) { color: var(--black); }
.kpi__v { font: 400 clamp(28px, 3.3vw, 60px)/.92 var(--display); overflow-wrap: anywhere; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi__l { font: 700 12px/1.25 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.kpi__s { font: 400 11px/1.3 var(--mono); opacity: .8; }

.bars { display: grid; gap: clamp(8px, 1.4vh, 14px); }
.bar { display: grid; grid-template-columns: minmax(90px, 26%) 1fr auto; gap: 12px; align-items: center; font: 700 12px/1.2 var(--mono); }
.bar__track { height: clamp(20px, 3.4vh, 34px); position: relative; background: color-mix(in srgb, var(--fg) 10%, transparent); }
.bar__fill {
  position: absolute; inset: 0 auto 0 0; width: calc(var(--w) * 1%);
  background: repeating-linear-gradient(90deg, var(--c, var(--fg)) 0 10px, transparent 10px 12px);
  transition: width 1.1s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--d, 0) * 90ms + 250ms);
}
.slide:not(.in) .bar__fill, .slide:not(.in) .col__fill { width: 0; }
.bar.hi .bar__fill { --c: var(--ac); }
.bar.hi { font-size: 13px; }
.bar__v { font: 400 clamp(18px, 1.8vw, 28px)/1 var(--display); min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }

.div { display: grid; gap: 12px; }
.div__row { display: grid; grid-template-columns: minmax(110px, 24%) 1fr 1fr 4.2em; align-items: center; gap: 0; font: 700 12px/1.2 var(--mono); }
.div__neg, .div__pos { height: clamp(26px, 4.4vh, 44px); position: relative; }
.div__neg { border-right: 2px solid var(--fg); }
.div__neg i, .div__pos i { position: absolute; top: 0; bottom: 0; width: calc(var(--w) * 1%); background: repeating-linear-gradient(90deg, var(--c) 0 10px, transparent 10px 12px); transition: width 1.1s cubic-bezier(.2,.7,.2,1) .3s; }
.div__neg i { right: 0; --c: var(--ac2); }
.div__pos i { left: 0; --c: var(--ac); }
.slide:not(.in) .div__neg i, .slide:not(.in) .div__pos i { width: 0; }
.div__v { font: 400 clamp(18px, 1.8vw, 28px)/1 var(--display); text-align: right; }

.stack__bar { display: flex; height: clamp(70px, 14vh, 130px); gap: 3px; }
.stack__seg { flex: var(--w) 1 0; background: var(--c); color: var(--bg); display: grid; align-content: end; padding: 10px; font: 400 clamp(18px, 2vw, 34px)/1 var(--display); transform-origin: left; transition: transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--d, 0) * 120ms + 250ms); overflow: hidden; }
.slide:not(.in) .stack__seg { transform: scaleX(0); }
.stack__legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; font: 700 11px/1.3 var(--mono); }
.stack__legend span { display: flex; gap: 8px; align-items: flex-start; }
.stack__legend i { width: 12px; height: 12px; flex: none; background: var(--c); margin-top: 1px; }

.cols { display: flex; align-items: flex-end; gap: clamp(10px, 2vw, 28px); height: clamp(200px, 40vh, 380px); border-bottom: 2px solid var(--fg); }
.col { flex: 1; height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 8px; text-align: center; }
.col__v { font: 400 clamp(22px, 2.6vw, 44px)/1 var(--display); }
.col__box { position: relative; }
.col__fill { position: absolute; inset: auto 0 0 0; height: calc(var(--h) * 1%); width: 100%; background: repeating-linear-gradient(0deg, var(--c, var(--fg)) 0 10px, transparent 10px 12px); transition: height 1.1s cubic-bezier(.2,.7,.2,1) calc(var(--d,0) * 120ms + .25s); }
.slide:not(.in) .col__fill { height: 0; }
.col.hi .col__fill { --c: var(--ac); }
.col__l { font: 700 12px/1.2 var(--mono); padding-top: 8px; }
.cols-wrap { display: grid; gap: 8px; }
.cols-labels { display: flex; gap: clamp(10px, 2vw, 28px); }
.cols-labels span { flex: 1; text-align: center; font: 700 11px/1.25 var(--mono); }

.tl { display: grid; grid-template-columns: repeat(var(--n), 1fr); position: relative; padding-top: 34px; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 4px; background: var(--fg); }
.tl__it { position: relative; padding-right: 12px; display: grid; gap: 8px; align-content: start; }
.tl__it::before { content: ""; position: absolute; top: -26px; left: 0; width: 16px; height: 16px; background: var(--ac); outline: 3px solid var(--bg); }
.tl__y { font: 400 clamp(22px, 2.4vw, 40px)/1 var(--display); }
.tl__t { font-size: clamp(12px, .95vw, 15px); line-height: 1.3; }

.flow { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
.flow__it { background: var(--fg); color: var(--bg); padding: 16px 14px; min-height: 130px; display: grid; align-content: space-between; gap: 10px; position: relative; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); padding-left: 24px; }
.flow__it:first-child { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-left: 16px; }
.flow__it:nth-child(even) { background: var(--ac); color: var(--fg); }
.t3 .flow__it:nth-child(even), .t4 .flow__it:nth-child(even), .t5 .flow__it:nth-child(even) { color: var(--black); }
.flow__n { font: 700 11px/1 var(--mono); opacity: .7; }
.flow__t { font: 400 clamp(16px, 1.5vw, 24px)/1 var(--display); text-transform: uppercase; }
.flow__s { font: 400 11px/1.3 var(--mono); }

.tbl { width: 100%; border-collapse: collapse; font-size: clamp(12px, .95vw, 15px); }
.tbl th { text-align: left; font: 700 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; padding: 0 10px 10px; border-bottom: 2px solid var(--fg); }
.tbl td { padding: clamp(8px, 1.3vh, 13px) 10px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); vertical-align: top; }
.tbl tr.hi td { background: var(--fg); color: var(--bg); font-weight: 700; }
.tbl td:first-child { font-weight: 700; }
.tbl-wrap { overflow-x: auto; }

.cards { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 3px; }
.card { background: color-mix(in srgb, var(--fg) 8%, transparent); border-top: 4px solid var(--fg); padding: clamp(12px, 1.6vw, 20px); display: grid; gap: 8px; align-content: start; min-height: 110px; }
.card:nth-child(3n+1) { border-top-color: var(--ac); }
.card__t { font: 400 clamp(17px, 1.6vw, 26px)/1 var(--display); text-transform: uppercase; }
.card__x { font-size: clamp(12px, .95vw, 15px); line-height: 1.35; }
.card__k { font: 700 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; opacity: .7; }

.nlist { display: grid; gap: 3px; counter-reset: n; }
.nl { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: clamp(10px, 1.5vh, 16px) 14px; background: color-mix(in srgb, var(--fg) 8%, transparent); }
.nl:nth-child(odd) { background: var(--fg); color: var(--bg); }
.nl__n { font: 400 30px/1 var(--display); }
.nl__t { font-size: clamp(13px, 1vw, 16px); line-height: 1.3; }
.nl__t b { display: block; font: 400 clamp(16px, 1.4vw, 22px)/1 var(--display); text-transform: uppercase; margin-bottom: 4px; }
.nl__s { font: 400 clamp(20px, 2.2vw, 36px)/1 var(--display); text-align: right; }

.quote { font: 400 clamp(36px, 5.4vw, 96px)/.95 var(--display); text-transform: uppercase; text-wrap: balance; }
.quote em { font-style: normal; color: var(--ac); }

.foda { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.foda > div { padding: clamp(12px, 1.6vw, 20px); min-height: clamp(120px, 20vh, 200px); display: grid; gap: 8px; align-content: start; }
.foda h4 { font: 400 clamp(20px, 2vw, 32px)/1 var(--display); text-transform: uppercase; }
.foda ul { list-style: none; display: grid; gap: 5px; font-size: clamp(12px, .95vw, 15px); }
.foda li::before { content: "■ "; font-size: 9px; vertical-align: 2px; }
.foda .f { background: var(--lime); color: var(--black); }
.foda .d { background: var(--cream); color: var(--black); }
.foda .o { background: var(--blue); color: var(--cream); }
.foda .am { background: var(--red); color: var(--cream); }

.funnel { display: grid; gap: 4px; justify-items: center; }
.fn { width: calc(100% - var(--i) * 9%); background: var(--fg); color: var(--bg); padding: clamp(9px, 1.4vh, 14px) 18px; display: grid; grid-template-columns: 1fr 1.4fr 1.2fr; gap: 12px; align-items: center; font-size: clamp(11px, .9vw, 14px); }
.fn:nth-child(even) { background: var(--ac); color: var(--fg); }
.t3 .fn:nth-child(even), .t4 .fn:nth-child(even), .t5 .fn:nth-child(even) { color: var(--black); }
.fn b { font: 400 clamp(16px, 1.5vw, 24px)/1 var(--display); text-transform: uppercase; }
.fn span:last-child { font-family: var(--mono); font-size: 11px; opacity: .85; }

.gantt { display: grid; gap: 6px; }
.gt { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
.gt__it { background: var(--c, var(--fg)); color: var(--bg); padding: 14px 12px; min-height: 120px; display: grid; align-content: space-between; gap: 8px; transform-origin: left; transition: transform .8s cubic-bezier(.2,.7,.2,1) calc(var(--d,0) * 110ms + .25s); }
.slide:not(.in) .gt__it { transform: scaleX(.02); }
.gt__it:nth-child(even) { --c: var(--ac); color: var(--fg); }
.t5 .gt__it:nth-child(even), .t4 .gt__it:nth-child(even) { color: var(--black); }
.gt__d { font: 700 11px/1.2 var(--mono); }
.gt__t { font: 400 clamp(17px, 1.6vw, 26px)/1 var(--display); text-transform: uppercase; }

.donut { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 2.4vw, 36px); align-items: center; }
.donut svg { width: clamp(160px, 26vh, 260px); height: auto; transform: rotate(-90deg); }
.donut circle { fill: none; }
.donut .bg { stroke: color-mix(in srgb, var(--fg) 15%, transparent); }
.donut .fg { stroke: var(--ac); stroke-dasharray: 100 100; stroke-dashoffset: calc(100 - var(--p)); transition: stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1) .3s; }
.slide:not(.in) .donut .fg { stroke-dashoffset: 100; }
.donut__v { font: 400 clamp(54px, 7vw, 120px)/.9 var(--display); }
.donut__l { font: 700 13px/1.3 var(--mono); text-transform: uppercase; }

.sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.sw div { aspect-ratio: 1 / 1.3; background: var(--c); color: var(--t); padding: 12px; display: grid; align-content: end; gap: 4px; font: 700 11px/1.2 var(--mono); outline: 1px solid color-mix(in srgb, var(--fg) 20%, transparent); }
.sw b { font: 400 22px/1 var(--display); }

.flavs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
.fl { background: var(--c); color: var(--t); padding: clamp(10px, 1.4vw, 18px); display: grid; gap: 8px; align-content: start; }
.fl img { width: 100%; height: auto; display: block; filter: drop-shadow(5px 6px 0 rgba(0,0,0,.45)); transform: rotate(-3deg); transition: transform .5s; }
.fl:hover img { transform: rotate(2deg) scale(1.04); }
.fl__n { font: 400 clamp(18px, 1.7vw, 28px)/1 var(--display); text-transform: uppercase; }
.fl__d { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 700 11px/1.3 var(--mono); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { border: 1.5px solid currentColor; padding: 8px 12px; font: 700 12px/1 var(--mono); text-transform: uppercase; }
.chips span:nth-child(3n+1) { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.score { display: grid; gap: 3px; }
.sc { display: grid; grid-template-columns: minmax(110px, 26%) 110px 1fr; gap: 14px; align-items: center; padding: 10px 12px; background: color-mix(in srgb, var(--fg) 7%, transparent); font-size: clamp(12px, .95vw, 15px); }
.sc b { font: 400 clamp(15px, 1.3vw, 21px)/1 var(--display); text-transform: uppercase; }
.verdict { font: 700 11px/1 var(--mono); text-transform: uppercase; padding: 6px 8px; text-align: center; }
.v-g { background: var(--lime); color: var(--black); }
.v-m { background: var(--cream); color: var(--black); }
.v-p { background: var(--red); color: var(--cream); }
.v-x { border: 1.5px dashed currentColor; }

.photo { width: 100%; max-width: 640px; justify-self: center; filter: drop-shadow(12px 12px 0 rgba(0,0,0,.55)); animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 -10px; } }

/* ---------- section covers & cover ---------- */
.cover, .sec { grid-template-rows: 1fr; }
.pix { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: var(--cell); pointer-events: none; }
.pix i { background: var(--fg); transform: scale(0); transition: transform .45s cubic-bezier(.7,0,.2,1); }
.pix i.on { transform: scale(1); }
.pix i.ac { background: var(--ac); }
.pix i.ac2 { background: var(--ac2); }
.sec__in { position: relative; z-index: 2; align-self: end; display: grid; gap: 18px; max-width: 980px; }
.sec__num { font: 400 clamp(110px, 22vw, 320px)/.78 var(--display); }
.sec__name { font: 400 clamp(44px, 7vw, 120px)/.9 var(--display); text-transform: uppercase; }
.sec__q { font: 500 clamp(18px, 2vw, 30px)/1.2 var(--sans); max-width: 30ch; }
.sec__list { display: flex; flex-wrap: wrap; gap: 6px; }
.sec__list span { background: var(--bg); border: 1.5px solid var(--fg); padding: 6px 9px; font: 700 11px/1 var(--mono); }
.sec__meta { font: 700 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; }

.cover__in { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 4vw; align-items: center; height: 100%; }
.cover__big { width: min(100%, 620px); aspect-ratio: 1200 / 562; background: var(--black); -webkit-mask: url("assets/fibo-logo.png") left center / contain no-repeat; mask: url("assets/fibo-logo.png") left center / contain no-repeat; }
.cover h1 { font: 400 clamp(40px, 6vw, 104px)/.92 var(--display); text-transform: uppercase; }

const esc = (s) => String(s);

function viz(v) {
  if (!v) return "";
  const L = v.label ? `<p class="src a" ${d(0)} style="opacity:.85">${v.label}</p>` : "";
  switch (v.type) {
    case "kpis":
      return `<div class="kpis">${v.items.map(([val, l, s], i) => `<div class="kpi a" ${d(i)}><span class="kpi__v" data-count="${val}">${val}</span><span><span class="kpi__l">${l}</span>${s ? `<br><span class="kpi__s">${s}</span>` : ""}</span></div>`).join("")}</div>`;
    case "bars":
      return `${L}<div class="bars">${v.items.map(([l, val, show, hi], i) => `<div class="bar a ${hi ? "hi" : ""}" ${d(i)}><span>${l}</span><span class="bar__track"><span class="bar__fill" style="--w:${Math.max(0, val / v.max * 100)};--d:${i}"></span></span><span class="bar__v">${show}</span></div>`).join("")}</div>${kpiLine(v.kpi)}`;
    case "diverge":
      return `${L}<div class="div">${v.items.map(([l, val], i) => { const w = Math.abs(val) / v.max * 100; return `<div class="div__row a" ${d(i)}><span>${l}</span><span class="div__neg"><i style="--w:${val < 0 ? w : 0}"></i></span><span class="div__pos"><i style="--w:${val > 0 ? w : 0}"></i></span><span class="div__v">${val > 0 ? "+" : "−"}${Math.abs(val)}%</span></div>`; }).join("")}</div>`;
    case "stack": {
      const tot = v.items.reduce((a, x) => a + x[1], 0);
      const cs = ["var(--fg)", "var(--ac)", "var(--ac2)", "color-mix(in srgb, var(--fg) 55%, var(--bg))", "color-mix(in srgb, var(--ac) 55%, var(--bg))"];
      return `${L}<div class="stack__bar a" ${d(1)}>${v.items.map(([l, val, show], i) => `<div class="stack__seg" style="--w:${val / tot * 100};--c:${cs[i % cs.length]};--d:${i};color:${i === 1 || i === 4 ? "var(--black)" : "var(--bg)"}">${show}</div>`).join("")}</div><div class="stack__legend a" ${d(3)}>${v.items.map(([l, val, show], i) => `<span style="--c:${cs[i % cs.length]}"><i></i>${l}</span>`).join("")}</div>`;
    }
    case "cols":
      return `${L}${kpiLine(v.kpi)}<div class="cols-wrap a" ${d(1)}><div class="cols">${v.items.map(([l, val, show, hi], i) => `<div class="col ${hi ? "hi" : ""}"><span class="col__v">${show}</span><span class="col__box"><span class="col__fill" style="--h:${val / v.max * 100};--d:${i}"></span></span></div>`).join("")}</div><div class="cols-labels">${v.items.map(([l]) => `<span>${l}</span>`).join("")}</div></div>`;
    case "timeline":
      return `<div class="tl" style="--n:${v.items.length}">${v.items.map(([y, t], i) => `<div class="tl__it a" ${d(i)}><span class="tl__y">${y}</span><span class="tl__t">${t}</span></div>`).join("")}</div>`;
    case "flow":
      return `<div class="flow" style="--n:${v.items.length}">${v.items.map(([t, s], i) => `<div class="flow__it a" ${d(i)}><span class="flow__n">0${i + 1}</span><span class="flow__t">${t}</span><span class="flow__s">${s}</span></div>`).join("")}</div>`;
    case "table":
      return `${v.img ? `<img class="photo a" ${d(0)} src="${v.img}" alt="" style="max-width:420px">` : ""}<div class="tbl-wrap a" ${d(1)}><table class="tbl"><thead><tr>${v.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${v.rows.map((r, i) => `<tr class="${v.hi === i ? "hi" : ""}">${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "cards":
      return `<div class="cards" style="--c:${v.cols || 2}">${v.items.map(([t, x, k], i) => `<div class="card a" ${d(i)}>${k ? `<span class="card__k">${k}</span>` : ""}<span class="card__t">${t}</span><span class="card__x">${x}</span></div>`).join("")}</div>`;
    case "nlist":
      return `${L}<div class="nlist">${v.items.map(([t, x, s], i) => `<div class="nl a" ${d(i)}><span class="nl__n">${String(i + 1).padStart(2, "0")}</span><span class="nl__t"><b>${t}</b>${x}</span><span class="nl__s" data-count="${s}">${s}</span></div>`).join("")}</div>`;
    case "foda":
      return `<div class="foda">${[["f", "Fortalezas", v.f], ["d", "Debilidades", v.d], ["o", "Oportunidades", v.o], ["am", "Amenazas", v.a]].map(([c, h, xs], i) => `<div class="${c} a" ${d(i)}><h4>${h}</h4><ul>${xs.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
    case "funnel":
      return `<div class="funnel">${v.items.map(([a, b, c], i) => `<div class="fn a" ${d(i)} style="--i:${i};--d:${i}"><b>${a}</b><span>${b}</span><span>${c}</span></div>`).join("")}</div>`;
    case "gantt":
      return `<div class="gt" style="--n:${v.items.length}">${v.items.map(([t, dt], i) => `<div class="gt__it" style="--d:${i}"><span class="gt__d">${dt}</span><span class="gt__t">${t}</span></div>`).join("")}</div>`;
    case "donut":
      return `<div class="donut a" ${d(0)}><svg viewBox="0 0 42 42" aria-hidden="true"><circle class="bg" cx="21" cy="21" r="15.9" pathLength="100" stroke-width="6"/><circle class="fg" cx="21" cy="21" r="15.9" pathLength="100" stroke-width="6" style="--p:${v.p}"/></svg><div><div class="donut__v" data-count="${v.v}">${v.v}</div><div class="donut__l">${v.l}</div><div class="src" style="margin-top:8px">${v.s}</div></div></div>`;
    case "chips":
      return `<div class="chips" style="${v.big ? "font-size:1.3em" : ""}">${v.items.map((x, i) => `<span class="a" ${d(i)} style="--d:${i};${v.big ? "font-size:clamp(13px,1.3vw,20px);padding:14px 18px" : ""}">${x}</span>`).join("")}</div>${v.big ? `<div class="cover__bars a" ${d(6)} style="grid-template-columns:1fr 1fr;margin-top:10px">${BAR_IMGS.slice(0, 2).map((s) => `<img src="${s}" alt="" style="width:100%">`).join("")}</div>` : ""}`;
    case "score":
      return `<div class="score">${v.items.map(([t, k, lab, x], i) => `<div class="sc a" ${d(i)}><b>${t}</b><span class="verdict v-${k}">${lab}</span><span>${x}</span></div>`).join("")}</div>`;
    case "swatch":
      return `${v.logo ? `<div class="a" ${d(0)} style="display:flex;gap:3px">${["#D6161D", "#0C0B0A", "#3A5CFF", "#C9F23A"].map((c, i) => `<span style="flex:1;background:${c};display:grid;place-items:center;padding:18px 0"><span class="logo" style="height:clamp(22px,3vw,44px);color:${i === 3 ? "#0C0B0A" : "#F2EFE8"}"></span></span>`).join("")}</div>` : ""}<div class="sw">${v.items.map(([c, n, t], i) => `<div class="a" ${d(i + 1)} style="--c:${c};--t:${t}"><b>${n}</b>${c}</div>`).join("")}</div><p class="src a" ${d(6)}>Tipografía: Anton (títulos) + Archivo (texto) · un color por sabor</p>`;
    case "flavs":
      return `<div class="flavs">${v.items.map(([img, n, c, t, ds], i) => `<div class="fl a" ${d(i)} style="--c:${c};--t:${t}"><img src="${img}" alt="Barra FIBO ${n}"><span class="fl__n">${n}</span><span class="fl__d">${ds.map((x) => `<span>${x}</span>`).join("")}</span></div>`).join("")}</div>`;
    case "persona":
      return `<div class="chips">${v.traits.map((x, i) => `<span class="a" ${d(i)} style="font-size:clamp(14px,1.4vw,22px);padding:14px 18px">${x}</span>`).join("")}</div><div class="cards" style="--c:2;margin-top:6px"><div class="card a" ${d(5)}><span class="card__k">FIBO diría</span>${v.say.map((x) => `<span class="card__x" style="font-weight:700">${x}</span>`).join("")}</div><div class="card a" ${d(6)}><span class="card__k">FIBO evitaría</span>${v.avoid.map((x) => `<span class="card__x">✕ ${x}</span>`).join("")}</div></div>`;
    case "two":
      return `<div class="cards" style="--c:2">${[v.a, v.b2].map(([h, xs], j) => `<div class="card a" ${d(j)} style="${j === 0 ? "background:var(--fg);color:var(--bg)" : ""}"><span class="card__t" style="font-size:clamp(24px,2.6vw,42px)">${h}</span>${xs.map((x) => `<span class="card__x" style="font-weight:700">■ ${x}</span>`).join("")}</div>`).join("")}</div>`;
  }
  return "";
}
function kpiLine(k) {
  return k ? `<div class="a" style="--d:1;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="kpi__v" data-count="${k[0]}" style="color:var(--ac)">${k[0]}</span><span class="kpi__l" style="max-width:30ch">${k[1]}</span></div>` : "";
}

function slideHTML(s, i) {
  const blk = BLOCKS[s.b - 1];
  const cls = `slide ${blk.t}`;
  if (s.type === "cover") {
    return `<section class="${cls} cover" data-i="${i}" aria-label="Portada"><div class="pix" data-pix="0.18"></div>
      <div class="cover__in"><div style="display:grid;gap:clamp(14px,2.6vh,26px)">
        <span class="sec__meta a" ${d(0)}>FIBO 2.0 · Estrategia integral · sep–dic 2026</span>
        <span class="cover__big a" ${d(1)} role="img" aria-label="FIBO"></span>
        <h1 class="a" ${d(2)}>Con FIBO <span>te encuentras.</span></h1>
        <p class="cover__sub a" ${d(3)}>Estrategia integral de marca, marketing y crecimiento comercial.</p>
        <p class="cover__meta a" ${d(4)}>Fecha de presentación y responsables por confirmar · 68 diapositivas en 6 bloques</p>
        <button class="cover__start a" ${d(5)} type="button" data-go="1">Empezar <svg viewBox="0 0 9 9"><use href="#arrowR"/></svg></button>
      </div><div class="cover__bars a" ${d(3)}>${BAR_IMGS.map((src) => `<img src="${src}" alt="">`).join("")}</div></div></section>`;
  }
  if (s.type === "sec") {
    return `<section class="${cls} sec" data-i="${i}" aria-label="Bloque ${blk.id}: ${blk.name}"><div class="pix" data-pix="0.22"></div>
      <div class="sec__in"><span class="sec__meta a" ${d(0)}>Bloque ${blk.id} de 6 · diapositivas ${s.range}</span>
      <span class="sec__num a" ${d(1)}>0${blk.id}</span><span class="sec__name a" ${d(2)}>${blk.name}</span>
      <p class="sec__q a" ${d(3)}>${blk.q}</p><div class="sec__list a" ${d(4)}>${s.list.map((x) => `<span>${x}</span>`).join("")}</div></div></section>`;
  }
  if (s.type === "index") {
    return `<section class="${cls}" data-i="${i}" aria-label="Índice"><div class="head a" ${d(0)}><span class="n">02</span><span>Índice general</span></div>
      <div class="body body--wide"><div class="copy"><h2 class="title a" ${d(1)}>Seis bloques, de entender a decidir.</h2><p class="msg a" ${d(2)}>Qué es FIBO → dónde está → qué pasa en el mercado → cómo debe posicionarse → cómo va a vender → cómo mediremos.</p></div>
      <div class="idx">${BLOCKS.map((b, j) => `<button class="a ${b.t}" ${d(j + 3)} type="button" data-block="${b.id}" style="background:var(--bg);color:var(--fg)"><b>0${b.id}</b><strong>${b.name}</strong><span>${b.q}</span></button>`).join("")}</div></div></section>`;
  }
  if (s.type === "end") {
    return `<section class="${cls} sec" data-i="${i}" aria-label="Cierre" style="--bg:var(--lime);--fg:var(--black);--ac:var(--red);--ac2:var(--blue)"><div class="pix" data-pix="0.2"></div>
      <div class="sec__in"><span class="cover__big a" ${d(0)} role="img" aria-label="FIBO"></span><span class="sec__name a" ${d(1)}>Con FIBO te encuentras.</span>
      <p class="sec__q a" ${d(2)}>Siguiente paso: revisar con la dirección las decisiones solicitadas y cerrar las validaciones pendientes antes de escalar la inversión.</p>
      <div class="sec__list a" ${d(3)}><span style="cursor:pointer" data-go="2">Volver al índice</span><a href="sitio.html" style="background:var(--black);color:var(--lime);border:1.5px solid var(--black);padding:6px 9px;font:700 11px/1 var(--mono);text-decoration:none">Ver el sitio de FIBO →</a></div></div></section>`;
  }
  const [stLabel, stCls] = STATUS[s.st] || ["", ""];
  const wide = s.quote && !s.pts;
  return `<section class="${cls}" data-i="${i}" aria-label="${s.n}. ${s.title}">
    <div class="head a" ${d(0)}><span class="n">${String(s.n).padStart(2, "0")}</span><span>${s.title}</span>${stLabel ? `<span class="chip ${stCls}">${stLabel}</span>` : ""}</div>
    <div class="body ${wide ? "body--wide" : ""}">
      <div class="copy">
        ${s.quote ? `<p class="quote a" ${d(1)}>${s.quote}</p>` : `<h2 class="title a" ${d(1)}>${s.msg.replace(/«/g, "“").replace(/»/g, "”")}</h2>`}

        ${s.pts ? `<ul class="pts">${s.pts.map((p, j) => `<li class="a" ${d(j + 2)}>${p}</li>`).join("")}</ul>` : ""}

      </div>
      <div class="viz">${viz(s.v)}</div>
    </div></section>`;
}

  if (b.id === 1) DECK.push(S[0], S[1]);
  if (items.length) {
    DECK.push({ b: b.id, type: "sec", range: `${items[0].n}–${items[items.length - 1].n}`, list: items.map((s) => `${s.n} · ${s.title}`) });
    DECK.push(...items);
  }
});
DECK.push(S[S.length - 1]);

const track = document.getElementById("track");
// merge duplicate style attributes produced by the templates above
track.innerHTML = DECK.map(slideHTML).join("").replace(/style="([^"]*)"\s+style="([^"]*)"/g, 'style="$1;$2"');
const slides = [...track.children];
const N = slides.length;

/* ---------- progress, overview ---------- */
const prog = document.getElementById("progress");
prog.innerHTML = slides.map((_, i) => `<b data-go="${i}" title="${i + 1}"></b>`).join("");
const ticks = [...prog.children];
document.getElementById("ovBody").innerHTML = BLOCKS.map((b) => `<div class="ov__blk"><h3><i style="background:${b.c};outline:1px solid #444"></i>0${b.id} · ${b.name}</h3><div class="ov__grid">${DECK.map((s, i) => s.b === b.id && !s.type ? `<button type="button" data-go="${i}" style="--c:${b.c}"><small>${String(s.n).padStart(2, "0")}</small>${s.title}</button>` : "").join("")}</div></div>`).join("");

/* ---------- count-up on numbers ---------- */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  const raw = el.dataset.count;
  const m = raw.match(/-?[\d.,]+/);
  if (!m || reduced) return;
  const numStr = m[0], pre = raw.slice(0, m.index), post = raw.slice(m.index + numStr.length);
  const decimals = (numStr.split(".")[1] || "").length, commas = numStr.includes(",");
  const target = parseFloat(numStr.replace(/,/g, ""));
  if (!isFinite(target)) return;
  const t0 = performance.now(), dur = 1100;
  const fmt = (v) => { let s = v.toFixed(decimals); if (commas) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); return pre + s + post; };
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = fmt(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else el.textContent = raw; };
  requestAnimationFrame(step);
}

/* ---------- pixel block backgrounds on covers ---------- */
const pixTimers = new Map();
function pixel(slide, on) {
  const g = slide.querySelector(".pix");
  if (!g) return;
  if (!on) { clearInterval(pixTimers.get(g)); return; }
  const w = slide.clientWidth, h = slide.clientHeight;
  const cols = w < 600 ? 6 : w < 1000 ? 9 : 12, cell = w / cols, rows = Math.ceil(h / cell);
  if (g.dataset.built !== `${cols}x${rows}`) {
    g.style.setProperty("--cols", cols); g.style.setProperty("--cell", cell + "px");
    g.innerHTML = "";
    const dens = parseFloat(g.dataset.pix);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const c = document.createElement("i");
      // keep the lower-left area (where the text sits) clear
      const textZone = (w < 820 ? x < cols - 1 : slide.classList.contains("cover") ? x < cols * 0.55 : x < cols * 0.68) || y === 0;
      if (!textZone) { c.dataset.ok = 1; if (Math.random() < dens) c.classList.add("on"); const r = Math.random(); if (r < 0.15) c.classList.add("ac"); else if (r < 0.27) c.classList.add("ac2"); }
      g.appendChild(c);
    }
    g.dataset.built = `${cols}x${rows}`;
  }
  if (reduced) return;
  const cells = [...g.querySelectorAll("i[data-ok]")];
  clearInterval(pixTimers.get(g));
  pixTimers.set(g, setInterval(() => { const a = cells[(Math.random() * cells.length) | 0]; a.classList.toggle("on"); }, 260));
}

/* ---------- navigation ---------- */
let cur = -1;
function go(i, instant) {
  i = Math.max(0, Math.min(N - 1, i));
  if (i === cur) return;
  const prev = slides[cur];
  if (prev) { prev.classList.remove("in"); pixel(prev, false); }
  cur = i;
  track.style.transition = instant ? "none" : "";
  track.style.transform = `translateX(${-i * 100}vw)`;
  const s = slides[i], meta = DECK[i], blk = BLOCKS[meta.b - 1];
  s.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.classList.add("in");
    s.querySelectorAll("[data-count]").forEach((el) => setTimeout(() => countUp(el), 250));
  }));
  pixel(s, true);
  const cs = getComputedStyle(s);
  document.documentElement.style.setProperty("--chrome", cs.getPropertyValue("--fg"));
  document.documentElement.style.setProperty("--chrome-bg", cs.getPropertyValue("--bg"));
  document.getElementById("count").textContent = `${String(i + 1).padStart(2, "0")} / ${N}`;
  document.getElementById("blockName").textContent = meta.type === "cover" ? "FIBO 2.0" : `0${blk.id} · ${blk.name}`;
  ticks.forEach((t, j) => { t.className = j === i ? "now" : j < i ? "done" : ""; });
  try { history.replaceState(null, "", `#s${i + 1}`); } catch (e) {}
}
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
addEventListener("keydown", (e) => {
  if (!document.getElementById("overlay").hidden) { if (e.key === "Escape") closeIdx(); return; }
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(N - 1);
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-block]");
  if (!t) return;
  if (t.dataset.block) { const b = +t.dataset.block; go(DECK.findIndex((s) => s.b === b && s.type === "sec")); }
  else go(+t.dataset.go);
  closeIdx();
});
// swipe
let sx = 0, sy = 0, st = 0;
const deck = document.getElementById("deck");
deck.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
deck.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - st < 800) go(cur + (dx < 0 ? 1 : -1));
}, { passive: true });
// overview
const overlay = document.getElementById("overlay");
function closeIdx() { overlay.hidden = true; }
document.getElementById("openIdx").onclick = () => { overlay.hidden = false; document.getElementById("closeIdx").focus(); };
document.getElementById("closeIdx").onclick = closeIdx;
addEventListener("resize", () => { track.style.transition = "none"; track.style.transform = `translateX(${-cur * 100}vw)`; const s = slides[cur]; if (s) { const g = s.querySelector(".pix"); if (g) g.dataset.built = ""; pixel(s, true); } });

addEventListener("hashchange", () => { const m = location.hash.match(/^#s(\d+)/); if (m) go(+m[1] - 1); });
const start = parseInt((location.hash.match(/^#s(\d+)/) || [])[1] || "1", 10) - 1;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => go(isFinite(start) ? start : 0, true));
</script>
</body>
</html>
